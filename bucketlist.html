<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>우리의 마법 같은 버킷리스트 🌠</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Noto+Sans+KR:wght@400;700&family=Poppins:wght@600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />

    <style>
      /* =========================================
           1. 몽환적인 오로라 & 밤하늘 배경
           ========================================= */
      body {
        margin: 0;
        padding: 0;
        font-family: "Noto Sans KR", sans-serif;
        background: linear-gradient(
          135deg,
          #0f172a 0%,
          #311847 40%,
          #662d60 80%,
          #9b4d81 100%
        );
        background-size: 300% 300%;
        animation: gradientShift 15s ease infinite;
        color: #ffffff;
        overflow-x: hidden;
        position: relative;
        min-height: 100vh;
      }

      @keyframes gradientShift {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      /* =========================================
           2. 🌠 동적 별똥별 & 배경 별빛 컨테이너
           ========================================= */
      #star-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
      }

      /* 꼬리가 긴 별똥별 스타일 */
      .shooting-star {
        position: absolute;
        width: 150px;
        height: 2px;
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 1) 0%,
          rgba(255, 255, 255, 0) 100%
        );
        border-radius: 50%;
        transform: rotate(-45deg);
        animation: shoot 1.5s ease-out forwards;
        opacity: 0;
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
      }

      @keyframes shoot {
        0% {
          transform: translateX(0) translateY(0) rotate(-45deg) scale(0.5);
          opacity: 1;
        }
        100% {
          transform: translateX(-800px) translateY(800px) rotate(-45deg)
            scale(1);
          opacity: 0;
        }
      }

      /* 반짝이는 배경 잔별 */
      .twinkle-star {
        position: absolute;
        background-color: white;
        border-radius: 50%;
        animation: twinkle 3s infinite alternate;
      }

      @keyframes twinkle {
        0% {
          opacity: 0.2;
          transform: scale(0.8);
          box-shadow: 0 0 5px rgba(255, 255, 255, 0.2);
        }
        100% {
          opacity: 1;
          transform: scale(1.2);
          box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }
      }

      /* =========================================
           3. 유리구슬(Glassmorphism) 헤더 디자인
           ========================================= */
      header {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(15px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        position: sticky;
        top: 0;
        z-index: 100;
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        padding: 10px 0;
      }

      nav.container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 800px;
        margin: 0 auto;
        padding: 0 20px;
      }

      .logo a {
        text-decoration: none;
        font-family: "Poppins", sans-serif;
        font-size: 1.6rem;
        font-weight: 600;
        color: #fff !important;
        display: flex;
        align-items: center;
        gap: 8px;
        text-shadow: 0 0 10px rgba(255, 182, 193, 0.8);
      }
      .logo a::before {
        content: "🧞";
      }

      .nav-links {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .nav-links li a {
        text-decoration: none;
        font-family: "Gaegu", cursive;
        font-size: 1.3rem;
        color: #fff !important;
        background: rgba(255, 255, 255, 0.1);
        padding: 8px 25px;
        border-radius: 30px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        transition: all 0.3s ease;
        box-shadow: 0 0 15px rgba(255, 182, 193, 0.2);
      }

      .nav-links li a:hover {
        background: rgba(255, 182, 193, 0.3);
        transform: translateY(-2px);
        box-shadow: 0 0 20px rgba(255, 182, 193, 0.5);
        border-color: #ffb6c1;
      }

      /* =========================================
           4. 버킷리스트 컨테이너 (빛나는 마법의 보드)
           ========================================= */
      .bucket-container {
        position: relative;
        z-index: 10;
        max-width: 800px;
        margin: 50px auto 100px;
        padding: 20px;
      }

      .page-title {
        text-align: center;
        font-family: "Gaegu", cursive;
        font-size: 3.5rem;
        color: #fff;
        margin: 0 0 10px;
        text-shadow:
          0 0 20px rgba(255, 182, 193, 0.8),
          0 0 40px rgba(214, 51, 108, 0.6);
      }

      .page-desc {
        text-align: center;
        color: rgba(255, 255, 255, 0.8);
        margin-bottom: 40px;
        font-size: 1.1rem;
      }

      /* 메인 리스트 카드 (반투명 유리 질감) */
      .bucket-paper {
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        padding: 40px 30px;
        border-radius: 25px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow:
          0 20px 50px rgba(0, 0, 0, 0.3),
          inset 0 0 20px rgba(255, 255, 255, 0.05);
      }

      .bucket-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .bucket-item {
        display: flex;
        align-items: center;
        padding: 20px 15px;
        border-bottom: 1px dashed rgba(255, 255, 255, 0.2);
        font-size: 1.15rem;
        cursor: pointer;
        transition: all 0.3s ease;
        color: #fff;
        font-weight: 500;
      }

      .bucket-item:last-child {
        border-bottom: none;
      }

      .bucket-item:hover {
        background-color: rgba(255, 255, 255, 0.1);
        border-radius: 15px;
        transform: translateX(5px);
      }

      /* 💖 하트 체크박스 글로우(Glow) 효과 💖 */
      .check-box {
        width: 30px;
        height: 30px;
        border: 2px solid rgba(255, 182, 193, 0.8);
        border-radius: 50%;
        margin-right: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: transparent;
        font-size: 18px;
        flex-shrink: 0;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        background: rgba(0, 0, 0, 0.2);
      }

      .check-box::before {
        content: "❤";
        color: transparent;
        transition: all 0.2s;
      }

      /* 체크 완료 시 효과 */
      .bucket-item.done .check-box {
        background: #ff758c;
        border-color: #ff758c;
        transform: scale(1.15);
        box-shadow: 0 0 20px #ff758c;
      }
      .bucket-item.done .check-box::before {
        color: #fff;
        text-shadow: 0 0 5px #fff;
      }

      .bucket-item.done span {
        text-decoration: line-through;
        color: rgba(255, 255, 255, 0.4);
      }

      /* =========================================
           5. 하단 돌아가기 버튼
           ========================================= */
      .home-btn {
        display: block;
        width: 250px;
        margin: 60px auto 0;
        padding: 15px;
        text-align: center;
        font-family: "Gaegu", cursive;
        font-size: 1.6rem;
        background: linear-gradient(135deg, #ff758c 0%, #d6336c 100%);
        color: white;
        text-decoration: none;
        border-radius: 50px;
        transition: all 0.3s;
        box-shadow: 0 10px 25px rgba(214, 51, 108, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }

      .home-btn:hover {
        transform: translateY(-5px);
        box-shadow: 0 15px 35px rgba(214, 51, 108, 0.8);
      }

      @media (max-width: 768px) {
        .page-title {
          font-size: 2.5rem;
        }
        .bucket-paper {
          padding: 30px 15px;
        }
        .bucket-item {
          font-size: 1rem;
        }
      }
    </style>
  </head>

  <body>
    <div id="star-container"></div>

    <header>
      <nav class="container">
        <h1 class="logo">
          <a href="index.html">Bucketlist</a>
        </h1>
        <ul class="nav-links">
          <li><a href="index.html">홈으로 🚀</a></li>
        </ul>
      </nav>
    </header>

    <div class="bucket-container">
      <h1 class="page-title">📝 2026 우리의 버킷리스트</h1>
      <p class="page-desc">별빛 아래서 하나씩 이루어갈 우리의 소중한 꿈들 ✨</p>

      <div class="bucket-paper">
        <ul class="bucket-list"></ul>
      </div>

      <a href="index.html" class="home-btn">소원함 닫기 💖</a>
    </div>

    <script>
      // ==========================================
      // 1. 버킷리스트 데이터 렌더링 및 체크 기능
      // ==========================================
      const bucketData = [
        "아쿠아리움 데이트 🐠",
        "서로를 위한 선물 만들어주기 (향수, 도예) 🎁",
        "같이 롯데월드 가서 교복 데이트 🏰",
        "찜질방 데이트 ♨",
        "머리 말려주기 💇",
        "하루 종일 온전히 서로에게 집중하기 📵",
        "해외 여행 가보기 ✈",
        "제주도 여행하기 🌴",
        "서로 도시락 싸주기 🍱",
        "1주년 기념 이미지 사진 찍기 📸",
        "커플링 맞추기 💍",
        "한강에서 라면 먹고 치맥하기 🍻",
        "같이 운동하기 (러닝, 헬스) 💪",
        "새벽 드라이브 즐기기 🚗💨",
        "소원 들어주기 내기하기 (볼링, 포켓볼) 🎳",
        "하루 종일 OTT 시청하기 🎬",
        "같이 등산하기 ⛰",
        "한복 입고 같이 사진 찍기 🎎",
        "같이 벚꽃 보러 가기 🌸",
      ];

      const bucketListUl = document.querySelector(".bucket-list");

      // 리스트 동적 생성
      bucketData.forEach((text, index) => {
        const li = document.createElement("li");
        li.className = "bucket-item";
        li.setAttribute("onclick", `toggleBucket(this, ${index})`);
        li.innerHTML = `<div class="check-box"></div><span>${text}</span>`;
        bucketListUl.appendChild(li);
      });

      function loadBucketList() {
        const savedData =
          JSON.parse(localStorage.getItem("myBucketList_new")) || [];
        const items = document.querySelectorAll(".bucket-item");

        items.forEach((item, index) => {
          if (savedData[index] === true) {
            item.classList.add("done");
          }
        });
      }

      function toggleBucket(item, index) {
        item.classList.toggle("done");

        // 체크했을 때 별똥별 하나 강제로 떨어뜨리기 효과 ✨
        if (item.classList.contains("done")) {
          createShootingStar();
        }

        saveAllBuckets();
      }

      function saveAllBuckets() {
        const items = document.querySelectorAll(".bucket-item");
        const statusArray = [];
        items.forEach((item) => {
          statusArray.push(item.classList.contains("done"));
        });
        localStorage.setItem("myBucketList_new", JSON.stringify(statusArray));
      }

      window.onload = () => {
        loadBucketList();
        generateTwinkleStars(50); // 배경에 잔별 50개 깔기
      };

      // ==========================================
      // 2. 🌠 자바스크립트 별똥별 & 배경 별빛 애니메이션
      // ==========================================
      const starContainer = document.getElementById("star-container");

      // (1) 배경에 반짝이는 잔별 만들기
      function generateTwinkleStars(count) {
        for (let i = 0; i < count; i++) {
          const star = document.createElement("div");
          star.classList.add("twinkle-star");
          // 무작위 위치 및 크기
          const size = Math.random() * 3 + 1; // 1px ~ 4px
          star.style.width = `${size}px`;
          star.style.height = `${size}px`;
          star.style.left = `${Math.random() * 100}vw`;
          star.style.top = `${Math.random() * 100}vh`;
          star.style.animationDelay = `${Math.random() * 3}s`; // 깜빡임 시간차
          starContainer.appendChild(star);
        }
      }

      // (2) 별똥별 생성 함수
      function createShootingStar() {
        const shootingStar = document.createElement("div");
        shootingStar.classList.add("shooting-star");

        // 화면 오른쪽 위 부근에서 무작위 시작
        shootingStar.style.left = `${Math.random() * 100 + 50}vw`;
        shootingStar.style.top = `${Math.random() * -50}vh`;

        // 크기 및 속도 약간씩 다르게
        const scale = Math.random() * 0.5 + 0.5; // 0.5 ~ 1배
        const duration = Math.random() * 1 + 1; // 1s ~ 2s
        shootingStar.style.transform = `rotate(-45deg) scale(${scale})`;
        shootingStar.style.animationDuration = `${duration}s`;

        starContainer.appendChild(shootingStar);

        // 애니메이션 끝나면 DOM에서 제거
        setTimeout(() => {
          shootingStar.remove();
        }, duration * 1000);
      }

      // 1.5초에서 3초 사이의 무작위 간격으로 별똥별 계속 떨어짐
      function startShootingStars() {
        createShootingStar();
        const nextTime = Math.random() * 1500 + 1500;
        setTimeout(startShootingStars, nextTime);
      }

      // 별똥별 떨어지기 시작!
      setTimeout(startShootingStars, 1000);
    </script>
  </body>
</html>
