<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>열 두 번째 데이트 | 홍대 데이트</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />

    <style>
      /* ========================================================================= */
      /* 🎨 [홍대 데이트 테마] 트렌디, 로맨틱, 네온 & 노을 감성 */
      /* ========================================================================= */

      body {
        margin: 0;
        padding: 0;
        text-align: center;
        font-family: "Noto Sans KR", sans-serif;
        min-height: 100vh;
        color: #333;

        /* 홍대의 해질녘 노을과 네온사인을 연상케 하는 부드러운 애니메이션 그라데이션 */
        background: linear-gradient(-45deg, #ff9a9e, #fecfef, #f5e3e6, #d9afd9);
        background-size: 400% 400%;
        animation: hongdaeSunset 15s ease infinite;
      }

      @keyframes hongdaeSunset {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      /* 배경 위로 은은하게 반짝이는 불빛(빛 망울) 느낌 오버레이 */
      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: radial-gradient(
          rgba(255, 255, 255, 0.4) 1px,
          transparent 2px
        );
        background-size: 30px 30px;
        pointer-events: none;
        z-index: -1;
      }

      /* ------------------------------------------------ */
      /* 1. 헤더 (메뉴바) - 트렌디한 유리 질감 (Glassmorphism) */
      /* ------------------------------------------------ */
      header {
        background: rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(12px);
        height: 70px;
        display: flex;
        align-items: center;
        box-shadow: 0 4px 15px rgba(255, 105, 180, 0.1);
        position: sticky;
        top: 0;
        z-index: 100;
        border-bottom: 1px solid rgba(255, 255, 255, 0.8);
      }

      nav.container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px;
        box-sizing: border-box;
      }

      .logo a {
        text-decoration: none;
        color: #ff4757;
        font-size: 1.6rem;
        font-weight: bold;
        letter-spacing: -1px;
      }

      .logo span {
        color: #d6336c;
      }

      .nav-links {
        list-style: none;
        display: flex;
        gap: 25px;
        margin: 0;
        padding: 0;
      }

      .nav-links a {
        text-decoration: none;
        color: #555;
        font-weight: bold;
        transition: color 0.3s ease;
      }

      .nav-links a:hover {
        color: #ff4757;
      }

      /* 햄버거 메뉴 버튼 (모바일용) */
      .menu-toggle {
        display: none;
        font-size: 1.8rem;
        cursor: pointer;
        color: #ff4757;
        user-select: none;
      }

      /* ------------------------------------------------ */
      /* 2. 페이지 제목 - 귀여운 네온 감성의 투명 박스 */
      /* ------------------------------------------------ */
      h1.page-title {
        background: rgba(255, 255, 255, 0.75);
        padding: 20px 40px;
        margin-top: 40px;
        margin-bottom: 30px;
        display: inline-block;
        color: #ff4757;
        border-radius: 30px;
        border: 2px solid #fff;
        box-shadow: 0 10px 25px rgba(255, 71, 87, 0.15);
        text-shadow: 0 2px 4px rgba(255, 71, 87, 0.1);
        backdrop-filter: blur(8px);
      }

      /* ------------------------------------------------ */
      /* 3. 갤러리 - 폴라로이드 사진 느낌으로 디자인 */
      /* ------------------------------------------------ */
      .gallery-container {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 30px;
        padding: 20px;
        max-width: 1200px;
        margin: 0 auto;
      }

      .gallery-container img {
        width: 300px;
        height: 300px;
        object-fit: cover;
        border-radius: 15px;
        border: 10px solid #ffffff; /* 하얀색 폴라로이드 테두리 */
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        background-color: #fff;
      }

      .gallery-container img:hover {
        /* 마우스 올리면 살짝 비틀어지며 떠오르는 트렌디한 효과 */
        transform: translateY(-12px) rotate(-3deg) scale(1.05);
        box-shadow: 0 15px 35px rgba(255, 71, 87, 0.25);
        border-color: #fff0f5;
      }

      /* ------------------------------------------------ */
      /* 4. 돌아가기 버튼 - 예쁜 핑크 그라데이션 젤리 버튼 */
      /* ------------------------------------------------ */
      .btn-back {
        display: inline-block;
        background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
        color: white;
        padding: 15px 45px;
        border-radius: 40px;
        text-decoration: none;
        font-weight: bold;
        font-size: 1.1rem;
        box-shadow: 0 8px 20px rgba(255, 117, 140, 0.4);
        transition: all 0.3s ease;
        border: none;
      }

      .btn-back:hover {
        background: linear-gradient(135deg, #ff4757 0%, #ff758c 100%);
        transform: translateY(-5px) scale(1.05);
        box-shadow: 0 12px 25px rgba(255, 71, 87, 0.5);
      }

      /* ------------------------------------------------ */
      /* 모바일 반응형 디자인 (햄버거 메뉴 포함) */
      /* ------------------------------------------------ */
      @media (max-width: 768px) {
        .menu-toggle {
          display: block;
        }

        .nav-links {
          display: none; /* 기본으로 숨김 */
          flex-direction: column;
          position: absolute;
          top: 100%;
          left: 0;
          width: 100%;
          background-color: rgba(255, 255, 255, 0.95);
          box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
          text-align: center;
          padding: 15px 0;
          backdrop-filter: blur(5px);
          border-bottom-left-radius: 15px;
          border-bottom-right-radius: 15px;
        }

        .nav-links li {
          margin: 15px 0;
        }

        .nav-links.active {
          display: flex;
        }

        h1.page-title {
          font-size: 1.5rem;
          padding: 15px 30px;
        }

        .gallery-container img {
          width: 100%;
          max-width: 320px;
          height: auto;
          aspect-ratio: 1 / 1;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <nav class="container">
        <h1 class="logo">
          <a href="index.html">우리<span>활동</span></a>
        </h1>

        <!-- 모바일 햄버거 메뉴 버튼 -->
        <div class="menu-toggle" onclick="toggleMenu()">☰</div>

        <ul class="nav-links" id="nav-menu">
          <li><a href="index.html">홈</a></li>
          <li><a href="date.html">갤러리</a></li>
          <li><a href="date.html">데이트 장소</a></li>
        </ul>
      </nav>
    </header>

    <h1 class="page-title">홍대 데이트 ❤️</h1>

    <div class="gallery-container">
      <img src="img9/1.jpeg" alt="사진1" />
      <img src="img9/2.jpeg" alt="사진2" />
      <img src="img9/3.jpeg" alt="사진3" />
      <img src="img9/4.jpeg" alt="사진4" />
      <img src="img9/5.jpeg" alt="사진5" />
      <img src="img9/6.jpeg" alt="사진6" />
    </div>

    <div style="text-align: center; margin: 60px 0">
      <a href="date.html" class="btn-back">돌아가기</a>
    </div>

    <!-- 햄버거 메뉴 동작용 자바스크립트 -->
    <script>
      function toggleMenu() {
        const navMenu = document.getElementById("nav-menu");
        navMenu.classList.toggle("active");
      }
    </script>
  </body>
</html>
