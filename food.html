<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>우리 공주님의 요리 솜씨</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <style>
      /* ── 기반 ── */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Noto Sans KR", sans-serif;
        background-color: #0b0f19;
        color: #f1e9ff;
        overflow-x: hidden;
        min-height: 100vh;
      }

      /* ── 배경 그라데이션 ── */
      .bg-night {
        position: fixed;
        inset: 0;
        z-index: -3;
        background: linear-gradient(-45deg, #0f0c29, #1a0933, #1e1b4b, #0f1a2e);
        background-size: 400% 400%;
        animation: bgMove 18s ease infinite;
      }
      @keyframes bgMove {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      /* ── 별 컨테이너 ── */
      .stars-wrap {
        position: fixed;
        inset: 0;
        z-index: -2;
        pointer-events: none;
      }
      .star-pt {
        position: absolute;
        border-radius: 50%;
        background: #fff;
        animation: twinkle infinite ease-in-out;
      }
      @keyframes twinkle {
        0%,
        100% {
          opacity: 0.15;
          transform: scale(0.8);
        }
        50% {
          opacity: 0.9;
          transform: scale(1.3);
          box-shadow:
            0 0 6px #fff,
            0 0 14px #c084fc;
        }
      }

      /* 떠오르는 파티클 */
      .particles {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: -1;
        list-style: none;
        padding: 0;
      }
      .particles li {
        position: absolute;
        bottom: -80px;
        color: rgba(255, 255, 255, 0.5);
        text-shadow: 0 0 8px rgba(192, 132, 252, 0.7);
        animation: floatUp linear infinite;
      }
      .particles li:nth-child(1) {
        left: 8%;
        font-size: 1.4rem;
        animation-duration: 14s;
      }
      .particles li:nth-child(2) {
        left: 25%;
        font-size: 1.8rem;
        animation-duration: 17s;
        animation-delay: 3s;
      }
      .particles li:nth-child(3) {
        left: 55%;
        font-size: 0.9rem;
        animation-duration: 11s;
        animation-delay: 5s;
      }
      .particles li:nth-child(4) {
        left: 72%;
        font-size: 2rem;
        animation-duration: 19s;
        animation-delay: 1s;
      }
      .particles li:nth-child(5) {
        left: 88%;
        font-size: 1.1rem;
        animation-duration: 13s;
        animation-delay: 7s;
      }
      @keyframes floatUp {
        0% {
          transform: translateY(0) rotate(0deg);
          opacity: 0;
        }
        15% {
          opacity: 1;
        }
        85% {
          opacity: 1;
        }
        100% {
          transform: translateY(-100vh) rotate(360deg);
          opacity: 0;
        }
      }

      /* ── 헤더 ── */
      header {
        position: sticky;
        top: 0;
        z-index: 1000;
        background: rgba(11, 15, 25, 0.7);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border-bottom: 1px solid rgba(192, 132, 252, 0.2);
      }
      header nav.container {
        position: relative;
        display: flex;
        align-items: center;
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 24px;
        height: 70px;
      }
      .logo {
        font-family: "Gaegu", cursive;
        font-size: 2rem;
        color: #fff;
        text-decoration: none;
        text-shadow: 0 0 12px rgba(192, 132, 252, 0.8);
        white-space: nowrap;
      }
      .logo span {
        color: #fcd34d;
      }

      .nav-center {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        font-family: "Gaegu", cursive;
        font-size: 1.25rem;
        color: #c084fc;
        letter-spacing: 0.05em;
        text-shadow: 0 0 10px rgba(192, 132, 252, 0.5);
        white-space: nowrap;
      }

      .header-right {
        position: absolute;
        right: 24px;
      }
      .menu-toggle-btn {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.25);
        color: #fff;
        padding: 7px 18px;
        border-radius: 20px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
      }
      .menu-toggle-btn:hover {
        background: rgba(255, 255, 255, 0.18);
      }

      .nav-links {
        display: none;
        flex-direction: column;
        position: absolute;
        top: 76px;
        right: 0;
        background: rgba(20, 16, 60, 0.92);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 20px;
        padding: 22px 32px;
        gap: 14px;
        text-align: center;
        list-style: none;
        z-index: 2000;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
        min-width: 160px;
      }
      .nav-links.active {
        display: flex;
        animation: dropAnim 0.3s forwards;
      }
      @keyframes dropAnim {
        from {
          opacity: 0;
          transform: translateY(-16px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .nav-links a {
        text-decoration: none;
        color: #cbd5e1;
        font-weight: bold;
        font-size: 1.05rem;
        transition: 0.25s;
        display: block;
      }
      .nav-links a:hover {
        color: #fcd34d;
        transform: translateX(-4px);
      }

      /* ── 히어로 ── */
      .hero {
        max-width: 820px;
        margin: 56px auto 0;
        padding: 0 20px;
      }
      .hero-inner {
        background: rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid rgba(192, 132, 252, 0.25);
        border-radius: 32px;
        padding: 52px 32px 44px;
        text-align: center;
        position: relative;
        overflow: hidden;
      }
      /* 히어로 내부 조명 */
      .hero-inner::before {
        content: "";
        position: absolute;
        top: -60px;
        left: 50%;
        transform: translateX(-50%);
        width: 340px;
        height: 200px;
        background: radial-gradient(
          ellipse,
          rgba(192, 132, 252, 0.18) 0%,
          transparent 70%
        );
        pointer-events: none;
      }
      .hero-emoji {
        font-size: 3.8rem;
        animation: floatMoon 4s ease-in-out infinite;
        filter: drop-shadow(0 0 18px rgba(192, 132, 252, 0.6));
        display: block;
        margin-bottom: 14px;
      }
      @keyframes floatMoon {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-12px);
        }
      }
      .hero-inner h1 {
        font-family: "Gaegu", cursive;
        font-size: 2.8rem;
        color: #fff;
        margin-bottom: 10px;
        text-shadow: 0 0 18px rgba(192, 132, 252, 0.7);
      }
      .hero-inner p {
        font-size: 1.15rem;
        color: #a78bcc;
      }

      /* 통계 바 */
      .hero-stats {
        display: flex;
        justify-content: center;
        gap: 32px;
        margin-top: 28px;
      }
      .stat-item {
        text-align: center;
      }
      .stat-num {
        font-family: "Gaegu", cursive;
        font-size: 2rem;
        color: #fcd34d;
        text-shadow: 0 0 10px rgba(252, 211, 77, 0.4);
      }
      .stat-label {
        font-size: 0.8rem;
        color: #8b77a8;
        margin-top: 2px;
      }

      /* ── 폼 섹션 ── */
      .section-wrap {
        max-width: 820px;
        margin: 36px auto 0;
        padding: 0 20px;
      }

      .form-panel {
        background: rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid rgba(192, 132, 252, 0.2);
        border-radius: 28px;
        padding: 36px 32px;
      }

      .panel-heading {
        font-family: "Gaegu", cursive;
        font-size: 1.6rem;
        color: #e2c8ff;
        text-align: center;
        margin-bottom: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-bottom: 16px;
      }
      .form-row.full {
        grid-template-columns: 1fr;
      }

      .form-field {
        display: flex;
        flex-direction: column;
        gap: 7px;
      }
      .form-field label {
        font-size: 0.88rem;
        font-weight: bold;
        color: #a78bcc;
        letter-spacing: 0.03em;
      }

      input[type="date"],
      input[type="text"],
      input[type="file"],
      textarea {
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(192, 132, 252, 0.3);
        border-radius: 12px;
        color: #f1e9ff;
        font-family: inherit;
        font-size: 1rem;
        padding: 11px 16px;
        transition: 0.25s;
        width: 100%;
      }
      input[type="date"]::-webkit-calendar-picker-indicator {
        filter: invert(1) opacity(0.5);
      }
      input[type="file"] {
        padding: 10px 14px;
        cursor: pointer;
        color: #a78bcc;
      }
      input:focus,
      textarea:focus {
        outline: none;
        border-color: #c084fc;
        background: rgba(192, 132, 252, 0.1);
        box-shadow: 0 0 0 3px rgba(192, 132, 252, 0.15);
      }
      textarea {
        resize: none;
        height: 85px;
      }
      input::placeholder,
      textarea::placeholder {
        color: rgba(167, 139, 204, 0.45);
      }

      /* 이미지 미리보기 */
      .img-preview-wrap {
        display: none;
        margin-top: 10px;
        text-align: center;
      }
      .img-preview-wrap img {
        max-width: 100%;
        max-height: 220px;
        border-radius: 14px;
        border: 2px dashed rgba(192, 132, 252, 0.45);
        padding: 4px;
      }

      .submit-row {
        text-align: center;
        margin-top: 24px;
      }
      .submit-btn {
        background: linear-gradient(135deg, #9333ea, #c084fc);
        color: #fff;
        border: none;
        padding: 13px 46px;
        font-size: 1.05rem;
        font-weight: bold;
        font-family: inherit;
        border-radius: 30px;
        cursor: pointer;
        box-shadow: 0 6px 24px rgba(147, 51, 234, 0.35);
        transition: 0.3s;
        letter-spacing: 0.03em;
      }
      .submit-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 30px rgba(147, 51, 234, 0.5);
      }

      /* ── 목록 섹션 ── */
      .list-section {
        margin-top: 44px;
      }
      .list-heading {
        font-family: "Gaegu", cursive;
        font-size: 1.5rem;
        color: #c084fc;
        margin-bottom: 24px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding-bottom: 12px;
        border-bottom: 1px solid rgba(192, 132, 252, 0.2);
      }

      /* 그리드 */
      .food-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
        gap: 22px;
      }

      /* 카드 */
      .food-card {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(192, 132, 252, 0.2);
        border-radius: 22px;
        overflow: hidden;
        transition: 0.35s;
        position: relative;
        display: flex;
        flex-direction: column;
      }
      .food-card:hover {
        transform: translateY(-8px);
        border-color: rgba(192, 132, 252, 0.55);
        box-shadow:
          0 16px 40px rgba(0, 0, 0, 0.4),
          0 0 0 1px rgba(192, 132, 252, 0.2);
      }

      /* 필름 프레임 사진 영역 — 시그니처 */
      .card-film {
        height: 188px;
        position: relative;
        background-color: #100820;
        overflow: hidden;
      }
      /* 필름 스프로킷 홀 (좌우) */
      .card-film::before,
      .card-film::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        width: 18px;
        background-image: repeating-linear-gradient(
          to bottom,
          transparent 0px,
          transparent 6px,
          rgba(255, 255, 255, 0.12) 6px,
          rgba(255, 255, 255, 0.12) 14px,
          transparent 14px,
          transparent 22px
        );
        z-index: 3;
      }
      .card-film::before {
        left: 0;
      }
      .card-film::after {
        right: 0;
      }

      .film-photo {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center;
        transition: transform 0.5s ease;
      }
      .food-card:hover .film-photo {
        transform: scale(1.05);
      }

      /* 이모지 폴백 */
      .film-emoji {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 3.8rem;
        background: linear-gradient(135deg, #1a0933 0%, #1e1b4b 100%);
      }

      /* 날짜 태그 (필름 위 오버레이) */
      .film-date {
        position: absolute;
        bottom: 10px;
        left: 24px;
        font-size: 0.75rem;
        font-weight: bold;
        color: rgba(255, 255, 255, 0.85);
        background: rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(6px);
        padding: 3px 10px;
        border-radius: 20px;
        z-index: 4;
        letter-spacing: 0.04em;
      }

      /* 삭제 버튼 */
      .delete-btn {
        position: absolute;
        top: 10px;
        right: 22px;
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #ff6b8a;
        font-size: 1.1rem;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: 0.25s;
        opacity: 0;
        z-index: 5;
      }
      .food-card:hover .delete-btn {
        opacity: 1;
      }
      .delete-btn:hover {
        background: #ff4757;
        color: #fff;
        border-color: transparent;
      }

      /* 카드 본문 */
      .card-body {
        padding: 18px 20px 20px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        flex: 1;
      }
      .card-title {
        font-size: 1.15rem;
        font-weight: bold;
        color: #f1e9ff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .card-comment {
        font-size: 0.92rem;
        color: #a78bcc;
        line-height: 1.55;
        flex: 1;
        padding: 10px 12px;
        background: rgba(192, 132, 252, 0.07);
        border-left: 2px solid rgba(192, 132, 252, 0.35);
        border-radius: 0 8px 8px 0;
      }

      /* 빈 상태 */
      .empty-state {
        grid-column: 1 / -1;
        text-align: center;
        padding: 60px 24px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px dashed rgba(192, 132, 252, 0.25);
        border-radius: 20px;
        color: #7c6a99;
      }
      .empty-state .empty-icon {
        font-size: 3rem;
        margin-bottom: 14px;
      }
      .empty-state p {
        font-size: 1rem;
        line-height: 1.7;
      }

      /* ── 하단 여백 ── */
      .page-end {
        height: 80px;
      }

      /* ── 반응형 ── */

      /* 태블릿 가로 (1024px 이하) */
      @media (max-width: 1024px) {
        .hero-inner h1 {
          font-size: 2.5rem;
        }
        .food-grid {
          grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        }
      }

      /* 태블릿 세로 (768px 이하) */
      @media (max-width: 768px) {
        header nav.container {
          padding: 0 16px;
          height: 62px;
        }
        .logo {
          font-size: 1.6rem;
        }
        .nav-center {
          display: none;
        }

        .hero {
          margin-top: 36px;
          padding: 0 16px;
        }
        .hero-inner {
          padding: 38px 22px 34px;
          border-radius: 24px;
        }
        .hero-inner h1 {
          font-size: 2.2rem;
        }
        .hero-inner p {
          font-size: 1rem;
        }
        .hero-emoji {
          font-size: 3rem;
        }
        .hero-stats {
          gap: 24px;
        }
        .stat-num {
          font-size: 1.7rem;
        }

        .section-wrap {
          padding: 0 16px;
          margin-top: 28px;
        }
        .form-panel {
          padding: 28px 22px;
          border-radius: 22px;
        }
        .panel-heading {
          font-size: 1.4rem;
        }

        .food-grid {
          grid-template-columns: repeat(2, 1fr);
          gap: 16px;
        }
        .card-film {
          height: 160px;
        }
      }

      /* 모바일 (480px 이하) */
      @media (max-width: 480px) {
        .logo {
          font-size: 1.35rem;
        }
        .menu-toggle-btn {
          padding: 6px 12px;
          font-size: 0.9rem;
        }

        .hero-inner {
          padding: 30px 16px 28px;
          border-radius: 20px;
        }
        .hero-inner h1 {
          font-size: 1.85rem;
        }
        .hero-emoji {
          font-size: 2.6rem;
          margin-bottom: 10px;
        }
        .hero-stats {
          gap: 16px;
        }
        .stat-num {
          font-size: 1.5rem;
        }
        .stat-label {
          font-size: 0.72rem;
        }

        .form-panel {
          padding: 22px 16px;
          border-radius: 18px;
        }
        .panel-heading {
          font-size: 1.25rem;
        }
        .form-row {
          grid-template-columns: 1fr;
        }
        .form-field label {
          font-size: 0.82rem;
        }
        input[type="date"],
        input[type="text"],
        input[type="file"],
        textarea {
          font-size: 0.95rem;
          padding: 10px 13px;
        }
        .submit-btn {
          padding: 12px 34px;
          font-size: 1rem;
        }

        .list-heading {
          font-size: 1.3rem;
        }
        .food-grid {
          grid-template-columns: 1fr;
          gap: 14px;
        }
        .card-film {
          height: 200px;
        }
        .card-title {
          font-size: 1.05rem;
        }
        .card-comment {
          font-size: 0.88rem;
        }
      }

      /* 초소형 모바일 (360px 이하) */
      @media (max-width: 360px) {
        .hero-inner h1 {
          font-size: 1.6rem;
        }
        .hero-stats {
          flex-direction: column;
          gap: 10px;
          align-items: center;
        }
        .logo {
          font-size: 1.2rem;
        }
      }
    </style>
  </head>

  <body>
    <div class="bg-night"></div>
    <div class="stars-wrap" id="starsWrap"></div>
    <ul class="particles">
      <li>🍱</li>
      <li>✨</li>
      <li>💜</li>
      <li>🌙</li>
      <li>🍳</li>
    </ul>

    <!-- 헤더 -->
    <header>
      <nav class="container">
        <a href="index.html" class="logo">⭐️ 공주 <span>소개</span> ✨</a>
        <div class="nav-center">공주님의 요리 솜씨 🍱</div>
        <div class="header-right">
          <button class="menu-toggle-btn" onclick="toggleNav()">☰ 메뉴</button>
        </div>
        <ul class="nav-links" id="nav-menu">
          <li><a href="index.html">홈</a></li>
          <li><a href="hhhh.html">공주님 소개</a></li>
          <li><a href="date.html">데이트 목록</a></li>
          <li><a href="photo.html">인생네컷</a></li>
          <li><a href="calendar.html">달력</a></li>
          <li><a href="bucketlist.html">버킷리스트</a></li>
          <li><a href="diary.html">우리의 일기장 📖</a></li>
          <li><a href="food.html">요리·도시락 🍱</a></li>
        </ul>
      </nav>
    </header>

    <!-- 히어로 -->
    <div class="hero">
      <div class="hero-inner">
        <span class="hero-emoji">🍱</span>
        <h1>공주님의 요리 솜씨</h1>
        <p>나만을 위한 정성 가득, 사랑의 맛 기록하기 💜</p>
        <div class="hero-stats">
          <div class="stat-item">
            <div class="stat-num" id="total-count">0</div>
            <div class="stat-label">총 기록 수</div>
          </div>
          <div class="stat-item">
            <div class="stat-num" id="latest-date">—</div>
            <div class="stat-label">최근 날짜</div>
          </div>
          <div class="stat-item">
            <div class="stat-num" id="photo-count">0</div>
            <div class="stat-label">사진 있는 기록</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 폼 -->
    <div class="section-wrap">
      <div class="form-panel">
        <h2 class="panel-heading">🌸 오늘의 레시피 등록 🌸</h2>

        <div class="form-row">
          <div class="form-field">
            <label for="food-date">📅 먹은 날짜</label>
            <input type="date" id="food-date" />
          </div>
          <div class="form-field">
            <label for="food-title">🍴 요리 이름</label>
            <input
              type="text"
              id="food-title"
              placeholder="예) 하트 계란말이, 제육볶음 도시락"
            />
          </div>
        </div>

        <div class="form-row full">
          <div class="form-field">
            <label for="food-img">📸 요리 사진 (선택)</label>
            <input
              type="file"
              id="food-img"
              accept="image/*"
              onchange="previewImage(event)"
            />
            <div class="img-preview-wrap" id="preview-box">
              <img id="img-preview-tag" src="" alt="미리보기" />
            </div>
            <input type="hidden" id="compressed-img-data" />
          </div>
        </div>

        <div class="form-row full">
          <div class="form-field">
            <label for="food-comment">✍️ 나의 솔직 리뷰</label>
            <textarea
              id="food-comment"
              placeholder="예) 세상에서 제일 맛있었어! 고마워 공주야 ❤️"
            ></textarea>
          </div>
        </div>

        <div class="submit-row">
          <button class="submit-btn" onclick="addFoodRecord()">
            사랑의 기록 등록하기 💖
          </button>
        </div>
      </div>

      <!-- 목록 -->
      <div class="list-section">
        <h2 class="list-heading">🍴 우리의 맛있는 추억들</h2>
        <div class="food-grid" id="food-list-wrapper"></div>
      </div>
    </div>

    <div class="page-end"></div>

    <script>
      const STORAGE_KEY = "princessFoodRecords";
      const wrapper = document.getElementById("food-list-wrapper");
      const foodEmojis = [
        "🍱",
        "🥗",
        "🍝",
        "🍛",
        "🥘",
        "🍲",
        "🍜",
        "🍤",
        "🍣",
        "🍙",
        "👨‍🍳",
        "🥚",
      ];

      document.getElementById("food-date").valueAsDate = new Date();

      /* ── 별 생성 ── */
      (function createStars() {
        const wrap = document.getElementById("starsWrap");
        for (let i = 0; i < 55; i++) {
          const s = document.createElement("div");
          s.className = "star-pt";
          const sz = Math.random() * 2.8 + 0.8;
          s.style.cssText = `
          width:${sz}px; height:${sz}px;
          left:${Math.random() * 100}vw; top:${Math.random() * 100}vh;
          animation-duration:${Math.random() * 3 + 1.8}s;
          animation-delay:${Math.random() * 2.5}s;
        `;
          wrap.appendChild(s);
        }
      })();

      /* ── 통계 업데이트 ── */
      function updateStats() {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        document.getElementById("total-count").textContent = data.length;
        document.getElementById("photo-count").textContent = data.filter(
          (d) => d.image,
        ).length;
        if (data.length > 0) {
          const latest = data.sort(
            (a, b) => new Date(b.date) - new Date(a.date),
          )[0];
          const d = new Date(latest.date);
          document.getElementById("latest-date").textContent =
            `${d.getMonth() + 1}/${d.getDate()}`;
        } else {
          document.getElementById("latest-date").textContent = "—";
        }
      }

      /* ── 이미지 압축 미리보기 ── */
      function previewImage(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (e) {
          const img = new Image();
          img.onload = function () {
            const canvas = document.createElement("canvas");
            const MAX = 640;
            const scale = img.width > MAX ? MAX / img.width : 1;
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            canvas
              .getContext("2d")
              .drawImage(img, 0, 0, canvas.width, canvas.height);
            const dataUrl = canvas.toDataURL("image/jpeg", 0.72);
            document.getElementById("img-preview-tag").src = dataUrl;
            document.getElementById("preview-box").style.display = "block";
            document.getElementById("compressed-img-data").value = dataUrl;
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }

      /* ── 기록 불러오기 ── */
      function loadFoodRecords() {
        const data = (JSON.parse(localStorage.getItem(STORAGE_KEY)) || []).sort(
          (a, b) => new Date(b.date) - new Date(a.date),
        );
        wrapper.innerHTML = "";

        if (data.length === 0) {
          wrapper.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🌙</div>
            <p>아직 등록된 요리 기록이 없어요.<br>
               공주님이 해주신 첫 번째 요리를 기록해보세요!</p>
          </div>`;
          updateStats();
          return;
        }

        data.forEach((item) => {
          const filmContent = item.image
            ? `<div class="film-photo" style="background-image:url('${item.image}')"></div>`
            : `<div class="film-emoji">${foodEmojis[Math.floor(Math.random() * foodEmojis.length)]}</div>`;

          wrapper.innerHTML += `
          <div class="food-card">
            <div class="card-film">
              ${filmContent}
              <span class="film-date">${formatDate(item.date)}</span>
              <button class="delete-btn" onclick="deleteRecord(${item.id})" title="삭제">&times;</button>
            </div>
            <div class="card-body">
              <div class="card-title" title="${item.title}">${item.title}</div>
              <div class="card-comment">${item.comment.replace(/\n/g, "<br>")}</div>
            </div>
          </div>`;
        });

        updateStats();
      }

      /* ── 기록 추가 ── */
      function addFoodRecord() {
        const date = document.getElementById("food-date").value;
        const title = document.getElementById("food-title").value.trim();
        const comment = document.getElementById("food-comment").value.trim();
        const imgData = document.getElementById("compressed-img-data").value;

        if (!date || !title || !comment) {
          alert("날짜, 요리 이름, 리뷰를 모두 입력해주세요! 💜");
          return;
        }

        const record = { id: Date.now(), date, title, comment, image: imgData };
        const all = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        all.push(record);

        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
        } catch (e) {
          alert(
            "저장 공간이 가득 찼어요 😢\n기존 사진 기록을 몇 개 지우고 다시 시도해주세요!",
          );
          return;
        }

        document.getElementById("food-title").value = "";
        document.getElementById("food-comment").value = "";
        document.getElementById("food-date").valueAsDate = new Date();
        document.getElementById("food-img").value = "";
        document.getElementById("preview-box").style.display = "none";
        document.getElementById("compressed-img-data").value = "";

        loadFoodRecords();
      }

      /* ── 기록 삭제 ── */
      function deleteRecord(id) {
        if (!confirm("이 소중한 기억을 삭제할까요? 😢")) return;
        const filtered = (
          JSON.parse(localStorage.getItem(STORAGE_KEY)) || []
        ).filter((r) => r.id !== id);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(filtered));
        loadFoodRecords();
      }

      function formatDate(str) {
        const d = new Date(str);
        return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일`;
      }

      function toggleNav() {
        document.getElementById("nav-menu").classList.toggle("active");
      }

      window.addEventListener("click", (e) => {
        const nav = document.getElementById("nav-menu");
        const btn = document.querySelector(".menu-toggle-btn");
        if (
          nav.classList.contains("active") &&
          !nav.contains(e.target) &&
          e.target !== btn
        )
          nav.classList.remove("active");
      });

      loadFoodRecords();
    </script>
  </body>
</html>
