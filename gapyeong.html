<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다섯번째 데이트</title>
    <link rel="stylesheet" href="style.css">

    <style>
        /* [1] 기본 스타일 초기화 */
        body {
            margin: 0;
            padding: 0;
            text-align: center;
            background-color: #f9f9f9;
            font-family: 'Noto Sans KR', sans-serif;
        }

        /* [2] 헤더(메뉴바) 스타일 - 여기가 핵심 수정 사항! */
        header {
            background: #fff;
            height: 70px;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            position: sticky;
            /* 스크롤 내려도 메뉴바 고정 */
            top: 0;
            z-index: 100;
        }

        /* 메뉴바 안쪽 내용 정렬 */
        nav.container {
            display: flex;
            justify-content: space-between;
            /* 양쪽 끝으로 벌리기 */
            align-items: center;
            /* 수직 가운데 정렬 */
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            box-sizing: border-box;
            /* 패딩 포함 크기 계산 */
        }

        /* 로고 스타일 */
        .logo a {
            text-decoration: none;
            color: #2563eb;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .logo span {
            color: #333;
        }

        /* 메뉴 리스트 스타일 */
        .nav-links {
            list-style: none;
            display: flex;
            gap: 20px;
            /* 메뉴 사이 간격 */
            margin: 0;
            padding: 0;
        }

        .nav-links a {
            text-decoration: none;
            color: #555;
            font-weight: bold;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #2563eb;
        }


        /* [3] 갤러리 스타일 */
        .gallery-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery-container img {
            width: 300px;
            height: 300px;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .gallery-container img:hover {
            transform: translateY(-5px);
        }

        /* 제목 스타일 */
        h1.page-title {
            background-color: #0cf33e;
            /* 요청하신 초록색 배경 */
            padding: 20px;
            margin-top: 0;
            /* 헤더랑 딱 붙게 하려면 0, 띄우려면 숫자 올리기 */
            color: #fff;
            /* 글자색 흰색이 더 잘 보일 것 같아 수정 (원하면 #333으로 변경) */
            margin-bottom: 30px;
        }

        /* 버튼 스타일 */
        .btn-back {
            display: inline-block;
            background-color: #8b5cf6;
            color: white;
            padding: 10px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.3s;
        }

        .btn-back:hover {
            background-color: #7c3aed;
        }

        /* ========================================================================= */
        /* 🔥 [여기서부터 새로 추가된 부분] 가평 불멍 & 바베큐 감성 덮어쓰기 (기존 코드 유지) */
        /* ========================================================================= */

        body {
            /* 밤하늘 베이스에 아래에서 위로 올라오는 따뜻한 모닥불(주황빛) 그라데이션 */
            background:
                radial-gradient(circle at 50% 110%, rgba(255, 107, 53, 0.2) 0%, transparent 60%),
                linear-gradient(to bottom, #1e212d 0%, #2b2524 100%) !important;
            background-attachment: fixed !important;
        }

        /* 배경이 밤(어두운 색)으로 변했으니, 제목 색상을 불멍 느낌의 따뜻한 오렌지/레드로 덮어씌워 줍니다 */
        h1.page-title {
            background-color: #e25822 !important;
            box-shadow: 0 4px 20px rgba(226, 88, 34, 0.4) !important;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
            border-bottom: 3px solid #ff8c42;
        }

        /* 사진과 영상들에 따뜻한 모닥불 불빛이 반사되는 듯한 그림자 추가 */
        img,
        video {
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6), 0 0 15px rgba(255, 120, 50, 0.15) !important;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* 화면 우측 하단에 캠핑/바베큐 감성 아이콘들을 살짝 띄워줍니다 (클릭 방해 X) */
        body::after {
            content: "✨ 🪵 🔥 ⛺ 🥩";
            position: fixed;
            bottom: 20px;
            right: 25px;
            font-size: 1.8rem;
            letter-spacing: 10px;
            opacity: 0.85;
            z-index: 999;
            pointer-events: none;
            text-shadow: 0 0 15px rgba(255, 150, 50, 0.6);
        }
    </style>
</head>

<body>

    <header>
        <nav class="container">
            <h1 class="logo">
                <a href="index.html">우리<span>활동</span></a>
            </h1>

            <ul class="nav-links">
                <li><a href="index.html">홈</a></li>
                <li><a href="date.html">갤러리</a></li>
                <li><a href="date.html">데이트 장소</a></li>
            </ul>
        </nav>
    </header>

    <h1 class="page-title">가평 데이트 ❤️</h1>

    <div style="display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; margin: 40px 0;"></div>
    <img style="width: 15%; max-width: 400px;" src="img/11111111.png" alt="사진1">
    <img style="width: 15%; max-width: 400px;" src="img/22222222.png" alt="사진2">
    <img style="width: 15%; max-width: 400px;" src="img/33333333.png" alt="사진3">
    <img style="width: 15%; max-width: 400px;" src="img/44444444.png" alt="사진4">

    </div>



    <div style="display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; margin: 40px 0;">

        <video style="width: 100%; max-width:500px;" controls>
            <source src="./video/1.mp4" type="video/mp4">
        </video>

        <video style="width: 100%; max-width: 500px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);"
            controls>
            <source src="./video/2.mp4" type="video/mp4">
        </video>

    </div>
    <div style="display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; margin: 40px 0;"></div>

    <video style="width: 15%; max-width: 400px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);" controls>
        <source src="./video/3.mp4" type="video/mp4">
    </video>
    <video style="width: 15%; max-width: 400px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);" controls>
        <source src="./video/4.mp4" type="video/mp4">
    </video>
    <video style="width: 15%; max-width: 400px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);" controls>
        <source src="./video/5.mp4" type="video/mp4">
    </video>
    <video style="width: 15%; max-width: 400px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);" controls>
        <source src="./video/6.mp4" type="video/mp4">
    </video>
    <video style="width: 15%; max-width: 400px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);" controls>
        <source src="./video/7.mp4" type="video/mp4">
    </video>

    </div>
    <div style="display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; margin: 40px 0;"></div>


    </div>
    <div style="text-align: center; margin: 60px 0;">
        <a href="date.html" class="btn-back">돌아가기</a>
    </div>

</body>

</html>
