<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>일곱 번째 데이트 | 서울랜드 데이트</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />

    <style>
      /* ========================================================================= */
      /* 🎢 [서울랜드 테마] 루나 파크 야간 빛 축제 & 놀이공원 네온 감성 */
      /* ========================================================================= */

      body {
        margin: 0;
        padding: 0;
        text-align: center;
        font-family: "Noto Sans KR", sans-serif;
        min-height: 100vh;
        color: #fff;

        /* 밤하늘과 화려한 놀이공원 조명을 연상케 하는 다크 그라데이션 */
        background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
        background-attachment: fixed;
        position: relative;
      }

      /* 흩날리는 불빛/컨페티 느낌 오버레이 */
      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image:
          radial-gradient(
            circle at 20% 30%,
            rgba(255, 0, 120, 0.15) 0%,
            transparent 40%
          ),
          radial-gradient(
            circle at 80% 70%,
            rgba(0, 200, 255, 0.15) 0%,
            transparent 40%
          ),
          radial-gradient(rgba(255, 255, 255, 0.8) 1px, transparent 2px);
        background-size:
          100% 100%,
          100% 100%,
          40px 40px;
        pointer-events: none;
        z-index: -1;
      }

      /* ------------------------------------------------ */
      /* 1. 헤더 (메뉴바) - 어두운 유리 질감 (Dark Glassmorphism) */
      /* ------------------------------------------------ */
      header {
        background: rgba(15, 12, 41, 0.7);
        backdrop-filter: blur(10px);
        height: 70px;
        display: flex;
        align-items: center;
        box-shadow:
          0 4px 15px rgba(0, 0, 0, 0.5),
          0 1px 0 rgba(255, 255, 255, 0.1);
        position: sticky;
        top: 0;
        z-index: 100;
      }

      nav.container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px;
        box-sizing: border-box;
      }

      .logo a {
        text-decoration: none;
        color: #00e5ff; /* 네온 시안 색상 */
        font-size: 1.6rem;
        font-weight: bold;
        text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
        letter-spacing: -1px;
      }

      .logo span {
        color: #ff007a; /* 네온 핑크 */
      }

      .nav-links {
        list-style: none;
        display: flex;
        gap: 25px;
        margin: 0;
        padding: 0;
      }

      .nav-links a {
        text-decoration: none;
        color: #e2e8f0;
        font-weight: bold;
        transition:
          color 0.3s ease,
          text-shadow 0.3s ease;
      }

      .nav-links a:hover {
        color: #00e5ff;
        text-shadow: 0 0 10px rgba(0, 229, 255, 0.8);
      }

      /* ------------------------------------------------ */
      /* 2. 페이지 제목 - 화려한 네온사인 스타일 */
      /* ------------------------------------------------ */
      .title-container {
        margin-top: 50px;
        margin-bottom: 20px;
      }

      h1.page-title {
        background: rgba(0, 0, 0, 0.5);
        padding: 20px 50px;
        display: inline-block;
        color: #fff;
        border-radius: 50px;
        border: 2px solid #0cf33e;
        box-shadow:
          0 0 15px rgba(12, 243, 62, 0.5),
          inset 0 0 15px rgba(12, 243, 62, 0.3);
        text-shadow:
          0 0 10px #0cf33e,
          0 0 20px #0ab12d;
        font-size: 2.2rem;
        backdrop-filter: blur(5px);
      }

      /* ------------------------------------------------ */
      /* 3. 갤러리 및 비디오 컨테이너 */
      /* ------------------------------------------------ */
      .media-container {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 25px;
        padding: 20px;
        max-width: 1200px;
        margin: 0 auto 40px auto;
      }

      .media-container img,
      .media-container video {
        width: 100%;
        max-width: 300px;
        height: 300px;
        object-fit: cover;
        border-radius: 20px;
        border: 2px solid rgba(255, 255, 255, 0.1);
        background-color: #1a1a2e;
        box-shadow:
          0 10px 20px rgba(0, 0, 0, 0.5),
          0 0 15px rgba(255, 0, 120, 0.2);
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      .media-container img:hover,
      .media-container video:hover {
        transform: translateY(-10px) scale(1.05);
        border-color: #00e5ff;
        box-shadow:
          0 15px 30px rgba(0, 0, 0, 0.6),
          0 0 20px rgba(0, 229, 255, 0.5);
        z-index: 10;
      }

      /* 비디오 높이 자동 조절 */
      .media-container video {
        height: auto;
        aspect-ratio: 1 / 1;
      }

      /* ------------------------------------------------ */
      /* 4. 돌아가기 버튼 - 놀이공원 티켓 느낌의 팝한 버튼 */
      /* ------------------------------------------------ */
      .btn-back {
        display: inline-block;
        background: linear-gradient(135deg, #ff8c42 0%, #ff3b30 100%);
        color: white;
        padding: 15px 50px;
        border-radius: 30px;
        text-decoration: none;
        font-weight: bold;
        font-size: 1.2rem;
        box-shadow: 0 8px 20px rgba(255, 59, 48, 0.4);
        border: 2px solid #ffcdd2;
        transition: all 0.3s ease;
      }

      .btn-back:hover {
        background: linear-gradient(135deg, #ffb74d 0%, #ff8c42 100%);
        transform: translateY(-5px) scale(1.05);
        box-shadow:
          0 12px 25px rgba(255, 140, 66, 0.6),
          0 0 15px rgba(255, 255, 255, 0.5);
      }

      /* ------------------------------------------------ */
      /* 모바일 반응형 디자인 */
      /* ------------------------------------------------ */
      @media (max-width: 768px) {
        h1.page-title {
          font-size: 1.5rem;
          padding: 15px 30px;
        }

        .media-container img,
        .media-container video {
          max-width: 100%;
          width: 90%;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <nav class="container">
        <h1 class="logo">
          <a href="index.html">우리<span>활동</span></a>
        </h1>

        <ul class="nav-links">
          <li><a href="index.html">홈</a></li>
          <li><a href="date.html">갤러리</a></li>
          <li><a href="date.html">데이트 장소</a></li>
        </ul>
      </nav>
    </header>

    <div class="title-container">
      <h1 class="page-title">서울랜드 데이트 🎢🎡✨</h1>
    </div>

    <!-- 📸 사진 섹션 (깔끔하게 묶어둔 컨테이너) -->
    <div class="media-container">
      <img src="img3/1.png" alt="사진1" />
      <img src="img3/2.png" alt="사진2" />
      <img src="img3/3.png" alt="사진3" />
      <img src="img3/4.png" alt="사진4" />
      <img src="img3/5.png" alt="사진5" />
    </div>

    <!-- 🎥 동영상 섹션 (깔끔하게 묶어둔 컨테이너) -->
    <div class="media-container">
      <video controls>
        <source src="./video/11.mp4" type="video/mp4" />
      </video>
      <video controls>
        <source src="./video/22.mp4" type="video/mp4" />
      </video>
      <video controls>
        <source src="./video/33.mp4" type="video/mp4" />
      </video>
      <video controls>
        <source src="./video/44.mp4" type="video/mp4" />
      </video>
    </div>

    <div style="text-align: center; margin: 60px 0">
      <a href="date.html" class="btn-back">돌아가기</a>
    </div>
  </body>
</html>
