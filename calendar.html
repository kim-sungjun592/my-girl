<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2026년 우리 달력</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Noto+Sans+KR:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />

    <style>
      /* =========================================
           1. 전체 배경 (크림색 도트 다이어리 감성)
           ========================================= */
      body {
        background-color: #fbf5f3;
        background-image: radial-gradient(#e5d9d5 1.5px, transparent 1.5px);
        background-size: 25px 25px;
        font-family: "Noto Sans KR", sans-serif;
        margin: 0;
        padding: 0;
        color: #555;
      }

      /* =========================================
           2. 사랑스러운 헤더 및 홈 버튼 디자인
           ========================================= */
      header {
        background-color: rgba(255, 255, 255, 0.95) !important;
        backdrop-filter: blur(5px) !important;
        position: sticky;
        top: 0;
        z-index: 100;
        box-shadow: 0 4px 15px rgba(255, 71, 87, 0.05) !important;
        border-bottom: 2px dashed #ffe4e6 !important;
        padding: 5px 0;
      }

      nav.container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 1200px;
        margin: 0 auto;
        padding: 10px 20px;
      }

      .logo {
        margin: 0;
      }
      .logo a {
        text-decoration: none;
        font-family: "Gaegu", cursive;
        font-size: 2.2rem;
        color: #ff758c !important;
        display: flex;
        align-items: center;
        gap: 8px;
        text-shadow: 1px 1px 0px #fff;
      }
      .logo a::before {
        content: "🗓️";
        font-size: 1.8rem;
      }
      .logo span {
        color: #d6336c !important;
      }

      .nav-links {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      /* 다이어리 스티커 느낌의 홈으로 버튼 */
      .nav-links li a {
        text-decoration: none;
        font-family: "Gaegu", cursive;
        font-size: 1.4rem;
        color: #d6336c !important;
        background: #fff;
        padding: 8px 25px;
        border-radius: 25px;
        border: 2px dashed #ffb6c1;
        transition: all 0.3s ease;
        box-shadow: 2px 4px 10px rgba(0, 0, 0, 0.05);
        display: inline-block;
      }

      .nav-links li a:hover {
        background: #fff0f5 !important;
        transform: translateY(-3px) rotate(-2deg);
        box-shadow: 4px 6px 15px rgba(255, 182, 193, 0.3);
        color: #ff758c !important;
      }

      /* =========================================
           3. 타이틀 및 달력 메인 디자인
           ========================================= */
      .year-title {
        text-align: center;
        font-family: "Gaegu", cursive;
        font-size: 3rem;
        color: #d6336c;
        margin: 50px 0 10px;
        text-shadow: 2px 2px 4px rgba(255, 182, 193, 0.4);
      }

      .year-title span {
        color: #ff758c;
        background: #fff0f5;
        padding: 0 15px;
        border-radius: 20px;
        display: inline-block;
        transform: rotate(-3deg);
        border: 1px dashed #ffb6c1;
      }

      .subtitle {
        text-align: center;
        color: #888;
        margin-bottom: 40px;
        font-size: 1.1rem;
        font-weight: bold;
      }

      .year-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 30px;
        max-width: 1200px;
        margin: 0 auto 60px;
        padding: 0 20px;
      }

      /* 개별 월 카드 디자인 (마스킹 테이프 효과 포함) */
      .month-card {
        background: #ffffff;
        border-radius: 20px;
        padding: 25px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
        border: 2px solid #fff0f5;
        transition: all 0.3s ease;
        cursor: pointer;
        position: relative;
      }

      .month-card::before {
        content: "";
        position: absolute;
        top: -12px;
        left: 50%;
        transform: translateX(-50%) rotate(-3deg);
        width: 70px;
        height: 25px;
        background-color: rgba(255, 182, 193, 0.6);
        z-index: 10;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      }

      .month-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 15px 30px rgba(255, 105, 180, 0.15);
        border-color: #ffb6c1;
      }

      .month-name {
        text-align: center;
        font-family: "Gaegu", cursive;
        font-size: 1.8rem;
        color: #ff758c;
        margin-bottom: 15px;
        border-bottom: 2px dashed #ffe4e6;
        padding-bottom: 10px;
      }

      .weekdays,
      .days {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        text-align: center;
      }

      .weekdays {
        font-size: 0.9rem;
        font-weight: bold;
        color: #a0a0a0;
        margin-bottom: 10px;
      }

      .day-num {
        padding: 5px 0;
        border-radius: 8px;
        font-size: 0.9rem;
        min-height: 45px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        transition: background-color 0.2s;
      }

      /* 일/토 색상 */
      .day-num:nth-child(7n + 1),
      .weekdays div:nth-child(1) {
        color: #ff758c;
      }
      .day-num:nth-child(7n),
      .weekdays div:nth-child(7) {
        color: #6fbcf3;
      }

      .today {
        background-color: #ff758c;
        color: white !important;
        font-weight: bold;
        box-shadow: 0 4px 10px rgba(255, 117, 140, 0.4);
      }

      .note-badge {
        font-size: 0.7rem;
        background-color: #fff0f5;
        color: #d6336c;
        padding: 2px 5px;
        border-radius: 5px;
        margin-top: 3px;
        width: 85%;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        line-height: 1.2;
        border: 1px solid #ffe4e6;
        font-weight: bold;
      }

      .today .note-badge {
        background-color: white;
        color: #ff758c;
        border: none;
      }

      /* =========================================
           4. 다이어리 팝업(모달) 스타일
           ========================================= */
      .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(
          255,
          240,
          245,
          0.85
        ); /* 모달 배경도 연분홍으로 부드럽게 */
        backdrop-filter: blur(4px);
        z-index: 1000;
        justify-content: center;
        align-items: center;
      }

      .modal-content {
        background: #ffffff;
        padding: 40px;
        border-radius: 25px;
        width: 90%;
        max-width: 700px;
        position: relative;
        box-shadow: 0 15px 40px rgba(255, 117, 140, 0.2);
        border: 3px dashed #ffb6c1;
        animation: popUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      .close-btn {
        position: absolute;
        top: 15px;
        right: 25px;
        font-size: 2.5rem;
        cursor: pointer;
        color: #ffb6c1;
        transition: color 0.2s;
        font-family: "Gaegu", cursive;
      }

      .close-btn:hover {
        color: #d6336c;
      }

      .modal-content .month-name {
        font-size: 2.5rem;
        margin-bottom: 30px;
        color: #d6336c;
      }

      .modal-content .day-num {
        font-size: 1.2rem;
        height: 80px;
        justify-content: flex-start;
        padding-top: 10px;
        cursor: pointer;
        border: 1px solid transparent;
      }

      .modal-content .day-num:hover {
        background-color: #fffafb;
        border: 1px dashed #ffb6c1;
      }

      .modal-content .note-badge {
        font-size: 0.85rem;
        padding: 3px 8px;
        margin-top: 5px;
        background-color: #ffe4e6;
      }

      /* =========================================
           5. 메모 입력창(스티커 메모지 느낌)
           ========================================= */
      #note-modal {
        z-index: 2000;
      }

      .note-content {
        background: #fff;
        padding: 35px 30px;
        border-radius: 20px;
        width: 320px;
        text-align: center;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        border: 2px solid #ffe4e6;
        position: relative;
      }

      .note-content::before {
        content: "📌";
        position: absolute;
        top: -15px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 2rem;
      }

      .note-date-title {
        font-family: "Gaegu", cursive;
        font-size: 1.8rem;
        color: #d6336c;
        margin-bottom: 20px;
        border-bottom: 2px dashed #ffe4e6;
        padding-bottom: 10px;
        display: inline-block;
      }

      textarea {
        width: 100%;
        height: 120px;
        padding: 15px;
        border: 2px solid #fff0f5;
        background-color: #fffafb;
        border-radius: 15px;
        resize: none;
        font-family: "Noto Sans KR", sans-serif;
        font-size: 0.95rem;
        margin-bottom: 20px;
        box-sizing: border-box;
        outline: none;
      }

      textarea:focus {
        border-color: #ffb6c1;
        background-color: #fff;
      }

      .btn-group button {
        font-family: "Gaegu", cursive;
        font-size: 1.3rem;
        padding: 8px 25px;
        border: none;
        border-radius: 25px;
        cursor: pointer;
        margin: 0 8px;
        transition: all 0.2s;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      }

      .delete-btn {
        background: #f1f2f6;
        color: #747d8c;
      }
      .delete-btn:hover {
        background: #dfe4ea;
      }

      .save-btn {
        background: #ff758c;
        color: white;
      }
      .save-btn:hover {
        background: #d6336c;
        transform: translateY(-2px);
      }

      @keyframes popUp {
        from {
          transform: scale(0.8) translateY(20px);
          opacity: 0;
        }
        to {
          transform: scale(1) translateY(0);
          opacity: 1;
        }
      }

      @media (max-width: 768px) {
        .year-grid {
          grid-template-columns: 1fr;
        }
        .year-title {
          font-size: 2.2rem;
        }
        .logo a {
          font-size: 1.8rem;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <nav class="container">
        <h1 class="logo">
          <a href="index.html">우리 둘만의 <span>달력</span></a>
        </h1>
        <ul class="nav-links">
          <li><a href="index.html">홈으로 🏠</a></li>
        </ul>
      </nav>
    </header>

    <div class="year-title">📅 <span>2026년</span> 우리의 기록</div>
    <p class="subtitle">우리 둘만의 소중하고 예쁜 메모리 🖊️💖</p>

    <div class="year-grid" id="calendar-wrapper"></div>

    <div class="modal-overlay" id="month-modal">
      <div class="modal-content">
        <span class="close-btn" onclick="closeMonthModal()">&times;</span>
        <div id="modal-body"></div>
      </div>
    </div>

    <div class="modal-overlay" id="note-modal" style="display: none">
      <div class="note-content">
        <div class="note-date-title" id="note-date-display"></div>
        <textarea
          id="note-input"
          placeholder="짧게 기록하는 게 예뻐요! (예: 롯데월드✨)"
        ></textarea>
        <div class="btn-group">
          <button class="delete-btn" onclick="closeNoteModal()">취소</button>
          <button class="save-btn" onclick="saveNote()">저장</button>
        </div>
      </div>
    </div>

    <script>
      const year = 2026;
      const calendarWrapper = document.getElementById("calendar-wrapper");
      const monthModal = document.getElementById("month-modal");
      const modalBody = document.getElementById("modal-body");
      const noteModal = document.getElementById("note-modal");
      const noteInput = document.getElementById("note-input");
      const noteDateDisplay = document.getElementById("note-date-display");

      const monthNames = [
        "1월",
        "2월",
        "3월",
        "4월",
        "5월",
        "6월",
        "7월",
        "8월",
        "9월",
        "10월",
        "11월",
        "12월",
      ];

      let currentMonth = 0;
      let currentDay = 0;

      // 초기화
      renderAllCalendars();

      function renderAllCalendars() {
        calendarWrapper.innerHTML = "";
        for (let i = 0; i < 12; i++) {
          const html = generateCalendarHTML(i, "small");
          calendarWrapper.innerHTML += `
                    <div class="month-card" onclick="openMonthModal(${i})">
                        ${html}
                    </div>`;
        }
      }

      // HTML 생성기
      function generateCalendarHTML(monthIndex, type) {
        const firstDay = new Date(year, monthIndex, 1).getDay();
        const lastDate = new Date(year, monthIndex + 1, 0).getDate();

        let html = `
                <div class="month-name">${monthNames[monthIndex]}</div>
                <div class="weekdays">
                    <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
                </div>
                <div class="days">
            `;

        for (let j = 0; j < firstDay; j++) {
          html += `<div></div>`;
        }

        for (let day = 1; day <= lastDate; day++) {
          // 1. 저장된 메모 가져오기
          const noteKey = `event_${year}_${monthIndex}_${day}`;
          const savedNote = localStorage.getItem(noteKey);

          // 2. 메모 HTML 만들기 (있을 때만)
          let noteHTML = "";
          if (savedNote) {
            const limit = type === "small" ? 8 : 15;
            const displayNote =
              savedNote.length > limit
                ? savedNote.substring(0, limit) + ".."
                : savedNote;
            noteHTML = `<div class="note-badge">${displayNote}</div>`;
          }

          // 3. 오늘 날짜 확인
          const today = new Date();
          let isToday =
            today.getFullYear() === year &&
            today.getMonth() === monthIndex &&
            today.getDate() === day
              ? "today"
              : "";

          // 4. 클릭 이벤트 (큰 달력일 때만)
          let clickAction = "";
          if (type === "large") {
            clickAction = `onclick="openNoteModal(${monthIndex}, ${day})"`;
          }

          html += `<div class="day-num ${isToday}" ${clickAction}>
                            <span>${day}</span>
                            ${noteHTML}
                         </div>`;
        }

        html += `</div>`;
        return html;
      }

      // --- 모달 로직 ---
      function openMonthModal(monthIndex) {
        currentMonth = monthIndex;
        updateModalView();
        monthModal.style.display = "flex";
      }

      function updateModalView() {
        modalBody.innerHTML = generateCalendarHTML(currentMonth, "large");
      }

      function closeMonthModal() {
        monthModal.style.display = "none";
        renderAllCalendars(); // 작은 달력들 갱신
      }

      function openNoteModal(m, d) {
        currentMonth = m;
        currentDay = d;
        noteDateDisplay.innerText = `${m + 1}월 ${d}일의 기록 💖`;
        const key = `event_${year}_${m}_${d}`;
        const savedNote = localStorage.getItem(key);
        noteInput.value = savedNote ? savedNote : "";
        noteModal.style.display = "flex";
      }

      function saveNote() {
        const noteText = noteInput.value.trim();
        const key = `event_${year}_${currentMonth}_${currentDay}`;

        if (noteText) {
          localStorage.setItem(key, noteText);
          alert("예쁜 기억이 기록되었어요! 💖");
        } else {
          localStorage.removeItem(key);
          alert("기록이 삭제되었습니다.");
        }

        closeNoteModal();
        updateModalView();
      }

      function closeNoteModal() {
        noteModal.style.display = "none";
      }

      window.onclick = function (event) {
        if (event.target == monthModal) closeMonthModal();
        if (event.target == noteModal) closeNoteModal();
      };
    </script>
  </body>
</html>
