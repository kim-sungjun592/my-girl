<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>여덟 번째 데이트</title>
    <link rel="stylesheet" href="style.css">

    <style>
        /* [1] 기본 스타일 초기화 */
        body {
            margin: 0;
            padding: 0;
            text-align: center;
            background-color: #f9f9f9;
            font-family: 'Noto Sans KR', sans-serif;
        }

        /* [2] 헤더(메뉴바) 스타일 - 여기가 핵심 수정 사항! */
        header {
            background: #fff;
            height: 70px;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            position: sticky;
            /* 스크롤 내려도 메뉴바 고정 */
            top: 0;
            z-index: 100;
        }

        /* 메뉴바 안쪽 내용 정렬 */
        nav.container {
            display: flex;
            justify-content: space-between;
            /* 양쪽 끝으로 벌리기 */
            align-items: center;
            /* 수직 가운데 정렬 */
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            box-sizing: border-box;
            /* 패딩 포함 크기 계산 */
        }

        /* 로고 스타일 */
        .logo a {
            text-decoration: none;
            color: #2563eb;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .logo span {
            color: #333;
        }

        /* 메뉴 리스트 스타일 */
        .nav-links {
            list-style: none;
            display: flex;
            gap: 20px;
            /* 메뉴 사이 간격 */
            margin: 0;
            padding: 0;
        }

        .nav-links a {
            text-decoration: none;
            color: #555;
            font-weight: bold;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #2563eb;
        }


        /* [3] 갤러리 스타일 */
        .gallery-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery-container img {
            width: 300px;
            height: 300px;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .gallery-container img:hover {
            transform: translateY(-5px);
        }

        /* 제목 스타일 */
        h1.page-title {
            background-color: #0cf33e;
            /* 요청하신 초록색 배경 */
            padding: 20px;
            margin-top: 0;
            /* 헤더랑 딱 붙게 하려면 0, 띄우려면 숫자 올리기 */
            color: #fff;
            /* 글자색 흰색이 더 잘 보일 것 같아 수정 (원하면 #333으로 변경) */
            margin-bottom: 30px;
        }

        /* 버튼 스타일 */
        .btn-back {
            display: inline-block;
            background-color: #8b5cf6;
            color: white;
            padding: 10px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.3s;
        }

        .btn-back:hover {
            background-color: #7c3aed;
        }
    </style>

    <style>
        /* ========================================================================= */
        /* 🏮 [4] 한국민속촌(조선시대 야경) 테마 추가 스타일 - 기존 코드 절대 유지 */
        /* ========================================================================= */

        body {
            /* 깊은 밤하늘과 은은한 청사초롱 불빛을 연상시키는 그라데이션 */
            background:
                radial-gradient(circle at 50% 15%, rgba(255, 170, 80, 0.15) 0%, transparent 50%),
                linear-gradient(to bottom, #0f172a 0%, #171717 100%) !important;
            background-attachment: fixed !important;
        }

        /* 전통 창호지/비단 느낌의 아주 옅은 빗살무늬 오버레이 (클릭 방해 X) */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.015) 0px, rgba(255, 255, 255, 0.015) 2px, transparent 2px, transparent 6px);
            z-index: -1;
            pointer-events: none;
        }

        /* 고풍스러운 궁궐 단청 느낌의 붉은색 + 금색 포인트 제목 */
        h1.page-title {
            background-color: #7f1d1d !important;
            /* 깊고 고급스러운 검붉은색 */
            border-bottom: 3px solid #d97706 !important;
            /* 금빛 테두리 */
            color: #fef3c7 !important;
            /* 누런 한지/금빛 텍스트 */
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(217, 119, 6, 0.2) !important;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        /* 사진과 영상을 전통 나무 액자와 한지 배경 위에 올린 듯한 연출 */
        img,
        video {
            border: 4px solid #451a03 !important;
            /* 고풍스러운 어두운 나무색 */
            padding: 6px !important;
            background-color: #fffbeb !important;
            /* 따뜻한 한지 색상 바탕 */
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7), 0 0 20px rgba(255, 150, 50, 0.1) !important;
            /* 은은한 등불 그림자 */
            border-radius: 6px !important;
            /* 프레임 느낌을 위해 기존보다 덜 둥글게 */
        }

        /* 돌아가기 버튼 전통 남색 톤으로 변경 */
        .btn-back {
            background-color: #1e3a8a !important;
            /* 깊은 남색 */
            border: 1px solid #d97706 !important;
            /* 얇은 금색 테두리 */
            color: #fef3c7 !important;
            /* 금빛 글자 */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            background-color: #172554 !important;
            /* 마우스 올렸을 때 더 어두운 남색 */
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.7), 0 0 10px rgba(217, 119, 6, 0.3);
        }
    </style>
</head>

<body>

    <header>
        <nav class="container">
            <h1 class="logo">
                <a href="index.html">우리<span>활동</span></a>
            </h1>

            <ul class="nav-links">
                <li><a href="index.html">홈</a></li>
                <li><a href="date.html">갤러리</a></li>
                <li><a href="date.html">데이트 장소</a></li>

        </nav>
    </header>

    <h1 class="page-title">한국민속촌 데이트 ❤️</h1>

    <video style="width: 30%; max-width: 400px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);" controls>

    <div style="display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; margin: 40px 0;"></div>

    <div style="text-align: center; margin: 60px 0;">
        <a href="date.html" class="btn-back">돌아가기</a>
    </div>

</body>

</html>
