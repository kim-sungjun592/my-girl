<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>여섯번째 데이트</title>
    <link rel="stylesheet" href="style.css">

    <style>
        /* [1] 기본 스타일 초기화 */
        body {
            margin: 0;
            padding: 0;
            text-align: center;
            background-color: #f9f9f9;
            font-family: 'Noto Sans KR', sans-serif;
        }

        /* [2] 헤더(메뉴바) 스타일 - 여기가 핵심 수정 사항! */
        header {
            background: #fff;
            height: 70px;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            position: sticky;
            /* 스크롤 내려도 메뉴바 고정 */
            top: 0;
            z-index: 100;
        }

        /* 메뉴바 안쪽 내용 정렬 */
        nav.container {
            display: flex;
            justify-content: space-between;
            /* 양쪽 끝으로 벌리기 */
            align-items: center;
            /* 수직 가운데 정렬 */
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            box-sizing: border-box;
            /* 패딩 포함 크기 계산 */
        }

        /* 로고 스타일 */
        .logo a {
            text-decoration: none;
            color: #2563eb;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .logo span {
            color: #333;
        }

        /* 메뉴 리스트 스타일 */
        .nav-links {
            list-style: none;
            display: flex;
            gap: 20px;
            /* 메뉴 사이 간격 */
            margin: 0;
            padding: 0;
        }

        .nav-links a {
            text-decoration: none;
            color: #555;
            font-weight: bold;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #2563eb;
        }


        /* [3] 갤러리 스타일 */
        .gallery-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery-container img {
            width: 300px;
            height: 300px;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .gallery-container img:hover {
            transform: translateY(-5px);
        }

        /* 제목 스타일 */
        h1.page-title {
            background-color: #0cf33e;
            /* 요청하신 초록색 배경 */
            padding: 20px;
            margin-top: 0;
            /* 헤더랑 딱 붙게 하려면 0, 띄우려면 숫자 올리기 */
            color: #fff;
            /* 글자색 흰색이 더 잘 보일 것 같아 수정 (원하면 #333으로 변경) */
            margin-bottom: 30px;
        }

        /* 버튼 스타일 */
        .btn-back {
            display: inline-block;
            background-color: #8b5cf6;
            color: white;
            padding: 10px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.3s;
        }

        .btn-back:hover {
            background-color: #7c3aed;
        }
    </style>

    <style>
        /* ========================================================================= */
        /* 🌿 [여기서부터 새로 추가된 부분] 포천 야외 동물원 & 목장 감성 덮어쓰기 (기존 코드 유지) */
        /* ========================================================================= */

        body {
            /* 맑은 하늘에서 푸른 잔디밭으로 이어지는 싱그러운 그라데이션 */
            background: linear-gradient(to bottom, #e0f2fe 0%, #f0fdf4 50%, #dcfce7 100%) !important;
            background-attachment: fixed !important;
            position: relative;
        }

        /* 제목을 목장 표지판 느낌의 예쁜 그린 톤으로 살짝 덮어씌움 */
        h1.page-title {
            background-color: #4ade80 !important;
            box-shadow: 0 4px 15px rgba(74, 222, 128, 0.4) !important;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
            border-bottom: 3px solid #22c55e;
        }

        /* 사진들에 하얀색 테두리를 줘서 폴라로이드 감성 추가 & 따뜻한 햇살 그림자 */
        img {
            background-color: white !important;
            padding: 10px !important;
            /* 사진에 흰 테두리 부여 */
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08), 0 0 15px rgba(255, 230, 150, 0.3) !important;
            border: 1px solid #e5e7eb !important;
            border-radius: 8px !important;
            /* 너무 둥글지 않게 살짝 깎음 */
        }

        /* 화면 우측 하단에 목장/동물원 감성 아이콘들을 살짝 띄워줍니다 (클릭 방해 X) */
        body::after {
            content: "☁️ ☀️ 🌳 🐑 🦜";
            position: fixed;
            bottom: 20px;
            right: 25px;
            font-size: 2rem;
            letter-spacing: 10px;
            opacity: 0.85;
            z-index: 999;
            pointer-events: none;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>

    <header>

    <div style="text-align: center; margin: 60px 0;">
        <a href="date.html" class="btn-back">돌아가기</a>

</body>

</html>
