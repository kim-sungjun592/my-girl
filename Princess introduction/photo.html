<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인생네컷</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <nav class="container">
            <h2 class="logo">
                <a href="index.html" style="text-decoration:none; color:inherit;">우리<span>활동</span></a>
            </h2>
            <ul class="nav-links">
                <li><a href="index.html">홈</a></li>
                <li><a href="date.html">갤러리</a></li>
                <li><a href="date.html">데이트 장소</a></li>
                <li><a href="hhhh.html">공주님 소개</a></li>
            </ul>
        </nav>
    </header>

    <style>
        /* [1] 기본 스타일 초기화 */
        body {
            margin: 0;
            padding: 0;
            text-align: center;
            background-color: #f9f9f9;
            font-family: 'Noto Sans KR', sans-serif;
        }

        /* [2] 헤더 스타일 */
        header {
            background: #fff;
            height: 70px;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav.container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .logo a {
            text-decoration: none;
            color: #2563eb;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .logo span {
            color: #333;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 20px;
            margin: 0;
            padding: 0;
        }

        .nav-links a {
            text-decoration: none;
            color: #555;
            font-weight: bold;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #2563eb;
        }

        /* [3] 갤러리 스타일 */
        .gallery-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery-container img {
            width: 120px;
            height: auto;
            object-fit: contain;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
            cursor: pointer;
            /* 클릭 가능하다는 표시 */
        }

        .gallery-container img:hover {
            transform: scale(1.05);
            /* 마우스 올리면 살짝 커짐 */
            filter: brightness(0.9);
        }

        /* 제목 스타일 */
        h1 {
            background-color: #0cf33e;
            padding: 20px;
            margin-top: 0;
            color: #fff;
            margin-bottom: 30px;
        }

        /* 버튼 스타일 */
        .btn-back {
            display: inline-block;
            background-color: #f67bd7;
            color: white;
            padding: 10px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.3s;
        }

        .btn-back:hover {
            background-color: #7c3aed;
        }

        /* [4] ★추가된 부분: 확대 모달창 스타일 */
        .zoom-overlay {
            display: none;
            /* 평소엔 숨김 */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            /* 검은 반투명 배경 */
            z-index: 1000;
            /* 헤더보다 위에 뜨도록 */
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s;
        }

        .zoom-img {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            object-fit: contain;
        }

        .close-zoom {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 3rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .close-zoom:hover {
            color: #ff4757;
            transform: rotate(90deg);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
    </style>
    <style>
        /* --- 추가된 배경 꾸미기 스타일 시작 --- */

        /* 1. 전체 배경에 폴라로이드 패턴과 따뜻한 그라데이션 적용 */
        body {
            /* 따뜻한 아이보리에서 연한 파란색으로 이어지는 부드러운 그라데이션 */
            background-image: linear-gradient(to bottom, #fffaf0, #eef6fc);
            /* 배경 위에 덧씌울 은은한 카메라 & 사진 패턴 (SVG 활용) */
            background-color: transparent;
            /* 기존 배경색 투명화 */
            position: relative;
            /* 패턴을 겹치기 위한 설정 */
        }

        /* 배경에 은은한 패턴 레이어 추가 */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* 카메라와 사진 모양의 아이콘 패턴 (연한 회색) */
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60" opacity="0.05"><path d="M30 10 C35 10 40 15 40 20 C40 25 35 30 30 30 C25 30 20 25 20 20 C20 15 25 10 30 10 Z M10 40 C10 35 15 30 20 30 L40 30 C45 30 50 35 50 40 L50 50 C50 55 45 60 40 60 L20 60 C15 60 10 55 10 50 Z M25 40 C25 43 27 45 30 45 C33 45 35 43 35 40 C35 37 33 35 30 35 C27 35 25 37 25 40 Z" fill="%23555"/></svg>');
            background-size: 60px 60px;
            /* 패턴 크기 조절 */
            z-index: -1;
            /* 내용물 뒤로 보냄 */
            pointer-events: none;
            /* 클릭 방해 안 하도록 */
        }

        /* 2. 제목 박스를 종이처럼 입체적으로 만들기 */
        h1 {
            /* 기존 초록색을 살짝 투명하게 해서 뒤에 패턴이 비치도록 */
            background-color: rgba(12, 243, 62, 0.85) !important;
            box-shadow: 0 8px 20px rgba(12, 243, 62, 0.3), 0 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 0 0 20px 20px;
            /* 아래쪽만 둥글게 */
            position: relative;
            z-index: 1;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            /* 글씨 그림자 */
        }

        /* 3. 갤러리 컨테이너를 폴라로이드 전시대처럼 꾸미기 */
        .gallery-container {
            background-color: #ffffff;
            /* 흰색 배경 */
            padding: 40px !important;
            /* 내부 여백 늘림 */
            border-radius: 20px;
            /* 둥근 모서리 */
            /* 실제 종이가 떠 있는 듯한 부드러운 그림자 */
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1), 0 5px 15px rgba(0, 0, 0, 0.05);
            margin-top: 40px !important;
            /* 제목과 간격 띄우기 */
            /* 테두리에 마스킹 테이프 붙인 느낌의 효과 */
            border: 1px solid rgba(0, 0, 0, 0.05);
            position: relative;
        }

        /* 갤러리 상단에 마스킹 테이프 효과 추가 (선택 사항) */
        .gallery-container::before {
            content: "";
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 30px;
            background-color: rgba(255, 235, 59, 0.5);
            /* 반투명 노란색 테이프 */
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            z-index: 2;
        }

        /* 4. 사진들에 흰색 폴라로이드 테두리 추가 */
        .gallery-container img {
            /* 기존 스타일에 더해 폴라로이드 느낌 추가 */
            background-color: white;
            padding: 10px 10px 25px 10px;
            /* 아래쪽 여백을 더 줘서 글씨 쓰는 공간 표현 */
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.15) !important;
            /* 기존 그림자보다 조금 더 진하게 */
            transform: rotate(calc(var(--r, 0deg) * 1deg));
            /* 랜덤하게 살짝 기울이기 위한 준비 */
        }

        /* 사진에 마우스 올렸을 때 효과 강화 */
        .gallery-container img:hover {
            transform: scale(1.1) rotate(0deg) !important;
            /* 기울기 펴지면서 확대 */
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3) !important;
            /* 그림자 진하게 */
            z-index: 10;
            /* 다른 사진들보다 위로 올라오게 */
        }

        /* 사진들을 조금씩 랜덤하게 기울여서 자연스럽게 배치 */
        .gallery-container img:nth-child(odd) {
            --r: -3;
        }

        /* 홀수번째 사진은 왼쪽으로 살짝 */
        .gallery-container img:nth-child(even) {
            --r: 2;
        }

        /* 짝수번째 사진은 오른쪽으로 살짝 */
        .gallery-container img:nth-child(3n) {
            --r: 1;
        }

        /* 3번째마다 다시 조정 */

        /* --- 추가된 배경 꾸미기 스타일 끝 --- */
        /* --- 📸 포토그래픽 감성 제목(h1) 꾸미기 시작 --- */

        h1 {
            /* 아날로그 카메라 느낌의 다크 그레이 배경 */
            background: linear-gradient(135deg, #2c3e50, #1a252f) !important;
            color: #fffaf0 !important;
            /* 살짝 따뜻한 아이보리색 글씨 */

            /* 글자 길이에 맞춰서 박스 크기가 자동으로 줄어들게 설정 */
            width: fit-content !important;
            margin: 30px auto 40px auto !important;
            /* 가운데 정렬 및 위아래 간격 띄우기 */
            padding: 20px 50px !important;
            border-radius: 10px !important;
            /* 모서리 살짝 둥글게 */

            /* 필름 띠 같은 흰색 점선 테두리 */
            border: 2px dashed rgba(255, 255, 255, 0.4) !important;
            outline: 8px solid #2c3e50;
            /* 바깥쪽 굵은 테두리로 앨범 라벨 느낌 강조 */

            /* 스크랩북에 무심하게 툭 붙인 느낌을 위해 살짝 기울이기 */
            transform: rotate(-2deg);

            /* 글씨 폰트 스타일링 */
            font-size: 2.2rem;
            letter-spacing: 3px;
            /* 글자 사이를 띄워서 여유롭게 */
            font-weight: 900;

            /* 글씨 뒤에서 은은하게 빛나는 조명 효과 */
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3), 0 0 20px rgba(255, 105, 180, 0.5) !important;

            /* 입체감을 살리는 박스 그림자 */
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.15), inset 0 0 20px rgba(0, 0, 0, 0.5) !important;
            position: relative;
        }

        /* 라벨 양옆에 박힌 은색 압정(나사) 모양 만들기 */
        h1::before,
        h1::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 14px;
            height: 14px;
            background: radial-gradient(circle, #e0e0e0 0%, #95a5a6 100%);
            border-radius: 50%;
            transform: translateY(-50%);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6), 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        /* 왼쪽 압정 위치 */
        h1::before {
            left: 15px;
        }

        /* 오른쪽 압정 위치 */
        h1::after {
            right: 15px;
        }

        /* 마우스 올렸을 때 살짝 똑바로 돌아오며 반응하는 애니메이션 */
        h1:hover {
            transform: rotate(0deg) scale(1.02);
            transition: all 0.3s ease;
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.2) !important;
        }

        /* --- 포토그래픽 감성 제목 꾸미기 끝 --- */
    </style>

    <h1 style="text-align: center; margin-top: 20px;">❤️Photography❤️</h1>

    <div class="gallery-container">
        <img src="img/11111.png" alt="사진1" onclick="openZoom(this)">
        <img src="img/22222.png" alt="사진2" onclick="openZoom(this)">
        <img src="img/33333.png" alt="사진3" onclick="openZoom(this)">
        <img src="img/44444.png" alt="사진4" onclick="openZoom(this)">
        <img src="img/55555.png" alt="사진5" onclick="openZoom(this)">
        <img src="img/66666.png" alt="사진6" onclick="openZoom(this)">
        <img src="img/77777.png" alt="사진7" onclick="openZoom(this)">
        <img src="img/88888.png" alt="사진8" onclick="openZoom(this)">
    </div>

    <div style="text-align: center; margin: 60px 0;">
        <a href="date.html" class="btn-back">돌아가기</a>
    </div>

    <div id="zoom-modal" class="zoom-overlay" onclick="closeZoom()">
        <span class="close-zoom">&times;</span>
        <img id="zoom-target" class="zoom-img" src="">
    </div>

    <script>
        // 사진 클릭 시 실행되는 함수
        function openZoom(element) {
            const modal = document.getElementById('zoom-modal');
            const zoomImg = document.getElementById('zoom-target');

            // 클릭한 사진의 주소를 가져와서 모달창 이미지에 넣음
            zoomImg.src = element.src;

            // 모달창 보여주기
            modal.style.display = 'flex';
        }

        // 닫기 함수
        function closeZoom() {
            document.getElementById('zoom-modal').style.display = 'none';
        }
    </script>

</body>

</html>
