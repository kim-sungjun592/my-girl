<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026년 우리 달력</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            background-color: #f5f4f4;
        }

        .year-title {
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
            color: #333;
            margin: 40px 0 20px;
        }

        .year-title span {
            color: #ff4757;
        }

        .year-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto 50px;
            padding: 0 20px;
        }

        .month-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid #ffe4e6;
            transition: 0.3s;
            cursor: pointer;
        }

        .month-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            border-color: #ff4757;
        }

        .month-name {
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: #ff4757;
            margin-bottom: 15px;
            border-bottom: 2px solid #fff0f6;
            padding-bottom: 10px;
        }

        .weekdays,
        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
        }

        .weekdays {
            font-size: 0.8rem;
            font-weight: bold;
            color: #888;
            margin-bottom: 5px;
        }

        /* 날짜 칸 디자인 수정 (글자 들어갈 공간 확보) */
        .day-num {
            padding: 5px 0;
            border-radius: 5px;
            font-size: 0.85rem;
            min-height: 40px;
            /* 높이 고정 */
            display: flex;
            flex-direction: column;
            /* 숫자와 메모를 위아래로 배치 */
            align-items: center;
            justify-content: flex-start;
        }

        /* 일/토 색상 */
        .day-num:nth-child(7n+1),
        .weekdays div:nth-child(1) {
            color: #ff4757;
        }

        .day-num:nth-child(7n),
        .weekdays div:nth-child(7) {
            color: #4facfe;
        }

        .today {
            background-color: #ff4757;
            color: white !important;
            font-weight: bold;
        }

        /* 오늘 날짜인데 메모가 있으면 배경색 살짝 투명하게 해서 글자 잘 보이게 */
        .today .note-badge {
            background-color: white;
            color: #ff4757;
        }

        /* ★ 메모 텍스트 (스티커) 스타일 ★ */
        .note-badge {
            font-size: 0.6rem;
            background-color: #fff0f6;
            /* 연한 분홍 배경 */
            color: #d6336c;
            /* 진한 분홍 글씨 */
            padding: 1px 4px;
            border-radius: 3px;
            margin-top: 2px;
            width: 90%;
            white-space: nowrap;
            /* 줄바꿈 금지 */
            overflow: hidden;
            /* 넘치면 숨김 */
            text-overflow: ellipsis;
            /* ... 으로 표시 */
            line-height: 1.2;
        }

        /* =========================================
           모달 관련 스타일
           ========================================= */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            width: 90%;
            max-width: 600px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: popUp 0.3s ease-out;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 2rem;
            cursor: pointer;
            color: #888;
            line-height: 1;
        }

        /* 확대 달력에서의 스타일 */
        .modal-content .month-name {
            font-size: 2rem;
            margin-bottom: 30px;
        }

        .modal-content .day-num {
            font-size: 1.2rem;
            height: 70px;
            /* 높이 더 키움 */
            justify-content: flex-start;
            padding-top: 5px;
            cursor: pointer;
        }

        .modal-content .day-num:hover {
            background-color: #f1f5f9;
            border-radius: 10px;
        }

        /* 확대 달력에서는 메모 글씨도 조금 더 크게 */
        .modal-content .note-badge {
            font-size: 0.75rem;
            padding: 2px 6px;
            margin-top: 5px;
        }

        /* 메모 입력창 */
        #note-modal {
            z-index: 2000;
        }

        .note-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 300px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .note-date-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 10px;
            resize: none;
            font-family: inherit;
            margin-bottom: 15px;
        }

        .btn-group button {
            padding: 8px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            margin: 0 5px;
        }

        .save-btn {
            background: #ff4757;
            color: white;
        }


        .delete-btn {
            background: #ced6e0;
            color: #333;
        }

        @keyframes popUp {
            from {
                transform: scale(0.8);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .year-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>

    <style>
        /* ========================================================================= */
        /* 🗓️ [새로 추가된 부분] 우리 둘만의 달력 페이지에 맞춘 사랑스러운 헤더 디자인 */
        /* ========================================================================= */

        header {
            background: rgba(255, 255, 255, 0.85) !important;
            /* 스크롤 시 달력이 살짝 비치는 효과 */
            backdrop-filter: blur(10px) !important;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.08) !important;
            border-bottom: 1px dashed #ffe4e6 !important;
            /* 달력 테두리와 같은 색상으로 통일 */
            padding: 5px 0;
        }

        nav.container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            /* 달력 그리드 폭(1200px)과 예쁘게 선을 맞춤 */
            margin: 0 auto;
            padding: 10px 20px;
        }

        .logo {
            margin: 0;
        }

        /* 로고 텍스트 스타일 통일 (인라인 스타일 덮어쓰기) */
        .logo a {
            text-decoration: none;
            font-size: 1.6rem;
            font-weight: 700;
            color: #ff4757 !important;
            /* 전체 테마 컬러인 체리 핑크로 변경 */
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 달력 로고 앞에 귀여운 이모지 추가 */
        .logo a::before {
            content: '🗓️';
            font-size: 1.4rem;
        }

        .logo span {
            color: #ff9fb3 !important;
            /* 연한 핑크색으로 포인트 */
        }

        .nav-links {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        /* 홈으로 버튼 (귀여운 알약 모양) */
        .nav-links li a {
            text-decoration: none;
            color: #ff4757 !important;
            font-weight: bold;
            background: #fff0f6;
            /* 연분홍 배경 */
            padding: 10px 20px;
            border-radius: 30px;
            /* 동글동글하게 */
            transition: all 0.3s ease;
            border: 1px solid #ffe4e6;
            box-shadow: 0 2px 8px rgba(255, 71, 87, 0.1);
        }

        /* 마우스 올렸을 때 애니메이션 */
        .nav-links li a:hover {
            background: #ff4757 !important;
            /* 체리 핑크로 짠! 변함 */
            color: white !important;
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(255, 71, 87, 0.2);
            border-color: #ff4757;
        }
    </style>

</head>

<body>

    <header>
        <nav class="container">
            <h1 class="logo"><a href="index.html" style="color: #f446a8;"> 우리 둘 만의 <span
                        style="color: #333;">달력</span></a></h1>
            <ul class="nav-links">
                <li><a href="index.html">홈으로</a></li>
            </ul>
        </nav>
    </header>

    <div class="year-title">📅 <span>2026년</span> 우리의 기록</div>
    <p style="text-align: center; color: #888; margin-bottom: 20px;">
        우리 둘만의 메모리 🖊️
    </p>

    <div class="year-grid" id="calendar-wrapper"></div>

    <div class="modal-overlay" id="month-modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeMonthModal()">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <div class="modal-overlay" id="note-modal" style="display: none;">
        <div class="note-content">
            <div class="note-date-title" id="note-date-display"></div>
            <textarea id="note-input" placeholder="짧게 기록하는 게 예뻐요! (예: 롯데월드)"></textarea>
            <div class="btn-group">
                <button class="delete-btn" onclick="closeNoteModal()">취소</button>
                <button class="save-btn" onclick="saveNote()">저장</button>
            </div>
        </div>
    </div>

    <script>
        const year = 2026;
        const calendarWrapper = document.getElementById('calendar-wrapper');
        const monthModal = document.getElementById('month-modal');
        const modalBody = document.getElementById('modal-body');
        const noteModal = document.getElementById('note-modal');
        const noteInput = document.getElementById('note-input');
        const noteDateDisplay = document.getElementById('note-date-display');

        const monthNames = ["1월", "2월", "3월", "4월", "5월", "6월", "7월", "8월", "9월", "10월", "11월", "12월"];

        let currentMonth = 0;
        let currentDay = 0;

        // 초기화
        renderAllCalendars();

        function renderAllCalendars() {
            calendarWrapper.innerHTML = "";
            for (let i = 0; i < 12; i++) {
                // 작은 달력은 'small' 타입으로 생성
                const html = generateCalendarHTML(i, 'small');
                calendarWrapper.innerHTML += `
                    <div class="month-card" onclick="openMonthModal(${i})">
                        ${html}
                    </div>`;
            }
        }

        // HTML 생성기 (텍스트 표시 로직 추가됨)
        function generateCalendarHTML(monthIndex, type) {
            const firstDay = new Date(year, monthIndex, 1).getDay();
            const lastDate = new Date(year, monthIndex + 1, 0).getDate();

            let html = `
                <div class="month-name">${monthNames[monthIndex]}</div>
                <div class="weekdays">
                    <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
                </div>
                <div class="days">
            `;

            for (let j = 0; j < firstDay; j++) {
                html += `<div></div>`;
            }

            for (let day = 1; day <= lastDate; day++) {
                // 1. 저장된 메모 가져오기
                const noteKey = `event_${year}_${monthIndex}_${day}`;
                const savedNote = localStorage.getItem(noteKey);

                // 2. 메모 HTML 만들기 (있을 때만)
                let noteHTML = "";
                if (savedNote) {
                    // type이 small이면 3글자, large면 6글자까지만 보여주고 ... 붙이기
                    const limit = (type === 'small') ? 10 : 15;
                    const displayNote = savedNote.length > limit ? savedNote.substring(0, limit) + '..' : savedNote;
                    noteHTML = `<div class="note-badge">${displayNote}</div>`;
                }

                // 3. 오늘 날짜 확인
                const today = new Date();
                let isToday = (today.getFullYear() === year && today.getMonth() === monthIndex && today.getDate() === day) ? "today" : "";

                // 4. 클릭 이벤트 (큰 달력일 때만)
                let clickAction = "";
                if (type === 'large') {
                    clickAction = `onclick="openNoteModal(${monthIndex}, ${day})"`;
                }

                html += `<div class="day-num ${isToday}" ${clickAction}>
                            <span>${day}</span>
                            ${noteHTML}
                         </div>`;
            }

            html += `</div>`;
            return html;
        }

        // --- 모달 로직 (이전과 동일) ---
        function openMonthModal(monthIndex) {
            currentMonth = monthIndex;
            updateModalView();
            monthModal.style.display = "flex";
        }

        function updateModalView() {
            // 큰 달력은 'large' 타입으로 생성
            modalBody.innerHTML = generateCalendarHTML(currentMonth, 'large');
        }

        function closeMonthModal() {
            monthModal.style.display = "none";
            renderAllCalendars(); // 작은 달력들 갱신
        }

        function openNoteModal(m, d) {
            currentMonth = m;
            currentDay = d;
            noteDateDisplay.innerText = `${m + 1}월 ${d}일의 기록`;
            const key = `event_${year}_${m}_${d}`;
            const savedNote = localStorage.getItem(key);
            noteInput.value = savedNote ? savedNote : "";
            noteModal.style.display = "flex";
        }

        function saveNote() {
            const noteText = noteInput.value.trim();
            const key = `event_${year}_${currentMonth}_${currentDay}`;

            if (noteText) {
                localStorage.setItem(key, noteText);
                alert("기록되었습니다! 💖");
            } else {
                localStorage.removeItem(key);
                alert("삭제되었습니다.");
            }

            closeNoteModal();
            updateModalView();
        }

        function closeNoteModal() {
            noteModal.style.display = "none";
        }

        window.onclick = function (event) {
            if (event.target == monthModal) closeMonthModal();
            if (event.target == noteModal) closeNoteModal();
        }
    </script>
</body>

</html>
