<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>인생네컷 - Photography</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <style>
      /* =========================================
           [1] 기본 스타일 & 배경 꾸미기
           ========================================= */
      body {
        margin: 0;
        padding: 0;
        text-align: center;
        font-family: "Noto Sans KR", sans-serif;
        background-image: linear-gradient(to bottom, #fffaf0, #eef6fc);
        position: relative;
        min-height: 100vh;
      }

      /* 은은한 패턴 배경 */
      body::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60" opacity="0.05"><path d="M30 10 C35 10 40 15 40 20 C40 25 35 30 30 30 C25 30 20 25 20 20 C20 15 25 10 30 10 Z M10 40 C10 35 15 30 20 30 L40 30 C45 30 50 35 50 40 L50 50 C50 55 45 60 40 60 L20 60 C15 60 10 55 10 50 Z M25 40 C25 43 27 45 30 45 C33 45 35 43 35 40 C35 37 33 35 30 35 C27 35 25 37 25 40 Z" fill="%23555"/></svg>');
        background-size: 60px 60px;
        z-index: -1;
        pointer-events: none;
      }

      /* =========================================
           [2] 헤더 & 드롭다운 메뉴 (필름 테마)
           ========================================= */
      header {
        background: #1a1a1a; /* 필름 느낌의 다크 배경 */
        height: 70px;
        display: flex;
        align-items: center;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        position: sticky;
        top: 0;
        z-index: 100;
        border-bottom: 2px solid #333;
      }

      nav.container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px;
        box-sizing: border-box;
        position: relative;
      }

      /* 로고 디자인: 사진기 감성 */
      .logo {
        margin: 0;
      }
      .logo a {
        text-decoration: none;
        color: #fff;
        font-size: 1.6rem;
        font-weight: 900;
        letter-spacing: 2px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .logo span {
        color: #f1c40f;
        font-weight: normal;
      } /* 노란색 포인트 */

      /* 햄버거 메뉴 버튼 */
      .menu-btn {
        background: transparent;
        color: #fff;
        border: 2px solid #555;
        padding: 8px 16px;
        border-radius: 20px;
        font-family: inherit;
        font-weight: bold;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .menu-btn:hover {
        background: #333;
        border-color: #f1c40f;
        color: #f1c40f;
      }

      /* 드롭다운 메뉴 (숨김 상태가 기본) */
      .nav-links {
        display: none; /* JS로 제어 */
        flex-direction: column;
        position: absolute;
        top: 75px;
        right: 20px;
        background: rgba(26, 26, 26, 0.95);
        backdrop-filter: blur(10px);
        border: 1px solid #444;
        border-radius: 15px;
        padding: 15px 0;
        margin: 0;
        list-style: none;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        min-width: 160px;
        z-index: 200;
        animation: slideDown 0.3s ease;
      }

      /* 메뉴가 열렸을 때 클래스 */
      .nav-links.active {
        display: flex;
      }

      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .nav-links li {
        width: 100%;
        text-align: center;
      }
      .nav-links a {
        display: block;
        text-decoration: none;
        color: #ccc;
        font-weight: bold;
        padding: 12px 20px;
        transition: 0.3s;
      }
      .nav-links a:hover {
        color: #f1c40f;
        background: rgba(255, 255, 255, 0.1);
      }

      /* =========================================
           [3] 사진 갤러리 영역 (폴라로이드 테마)
           ========================================= */
      h1 {
        background: linear-gradient(135deg, #2c3e50, #1a252f) !important;
        color: #fffaf0 !important;
        width: fit-content !important;
        margin: 40px auto !important;
        padding: 20px 50px !important;
        border-radius: 10px !important;
        border: 2px dashed rgba(255, 255, 255, 0.4) !important;
        outline: 8px solid #2c3e50;
        transform: rotate(-2deg);
        font-size: 2.2rem;
        letter-spacing: 3px;
        font-weight: 900;
        text-shadow:
          0 0 10px rgba(255, 255, 255, 0.3),
          0 0 20px rgba(255, 105, 180, 0.5) !important;
        box-shadow:
          0 15px 25px rgba(0, 0, 0, 0.15),
          inset 0 0 20px rgba(0, 0, 0, 0.5) !important;
        position: relative;
        z-index: 1;
      }

      h1::before,
      h1::after {
        content: "";
        position: absolute;
        top: 50%;
        width: 14px;
        height: 14px;
        background: radial-gradient(circle, #e0e0e0 0%, #95a5a6 100%);
        border-radius: 50%;
        transform: translateY(-50%);
        box-shadow:
          inset 0 2px 4px rgba(0, 0, 0, 0.6),
          0 2px 4px rgba(0, 0, 0, 0.3);
      }
      h1::before {
        left: 15px;
      }
      h1::after {
        right: 15px;
      }
      h1:hover {
        transform: rotate(0deg) scale(1.02);
        transition: all 0.3s ease;
        box-shadow: 0 20px 30px rgba(0, 0, 0, 0.2) !important;
      }

      .gallery-container {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 25px;
        max-width: 1000px;
        margin: 0 auto;
        background-color: #ffffff;
        padding: 50px 40px !important;
        border-radius: 2px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        position: relative;
        border: 1px solid rgba(0, 0, 0, 0.05);
      }

      /* 갤러리 상단 마스킹 테이프 장식 */
      .gallery-container::before {
        content: "";
        position: absolute;
        top: -15px;
        left: 50%;
        transform: translateX(-50%) rotate(-2deg);
        width: 180px;
        height: 35px;
        background-color: rgba(255, 235, 59, 0.6);
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        z-index: 2;
      }

      /* 폴라로이드 사진 프레임 */
      .gallery-container img {
        width: 140px;
        height: auto;
        object-fit: contain;
        background-color: white;
        padding: 12px 12px 35px 12px;
        box-shadow: 3px 5px 15px rgba(0, 0, 0, 0.15);
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        transform: rotate(calc(var(--r, 0deg) * 1deg));
      }

      .gallery-container img:hover {
        transform: scale(1.15) rotate(0deg) !important;
        box-shadow: 0 20px 30px rgba(0, 0, 0, 0.3);
        z-index: 10;
      }

      /* 사진들 지그재그 회전값 */
      .gallery-container img:nth-child(odd) {
        --r: -4;
      }
      .gallery-container img:nth-child(even) {
        --r: 3;
      }
      .gallery-container img:nth-child(3n) {
        --r: 1;
      }

      /* =========================================
           [4] 버튼 & 모달창
           ========================================= */

      /* 돌아가기 버튼 (빈티지 셔터/티켓 느낌) */
      .btn-back {
        display: inline-block;
        background-color: #1a1a1a;
        color: white;
        padding: 15px 40px;
        border-radius: 5px;
        text-decoration: none;
        font-size: 1.1rem;
        font-weight: bold;
        letter-spacing: 2px;
        border: 2px dashed #f1c40f;
        outline: 6px solid #1a1a1a;
        transition: all 0.3s;
        box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
        position: relative;
      }

      .btn-back::before {
        content: "📸";
        margin-right: 10px;
      }

      .btn-back:hover {
        background-color: #2c3e50;
        outline-color: #2c3e50;
        transform: translateY(-3px);
        box-shadow: 0 12px 20px rgba(0, 0, 0, 0.3);
      }

      .zoom-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.9);
        z-index: 1000;
        justify-content: center;
        align-items: center;
        animation: fadeIn 0.3s;
      }

      .zoom-img {
        max-width: 90%;
        max-height: 85vh;
        border-radius: 5px;
        background: white;
        padding: 15px 15px 40px 15px;
        box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
        object-fit: contain;
      }

      .close-zoom {
        position: absolute;
        top: 20px;
        right: 30px;
        color: white;
        font-size: 3rem;
        cursor: pointer;
        transition: 0.3s;
      }
      .close-zoom:hover {
        color: #f1c40f;
        transform: rotate(90deg);
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @media (max-width: 600px) {
        h1 {
          font-size: 1.5rem;
          padding: 15px 30px !important;
        }
        .gallery-container {
          padding: 30px 20px !important;
        }
        .gallery-container img {
          width: 110px;
        }
        .logo a {
          font-size: 1.3rem;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <nav class="container">
        <h2 class="logo">
          <a href="index.html">📸 우리<span>활동</span></a>
        </h2>

        <button class="menu-btn" onclick="toggleMenu()">☰ 메뉴</button>

        <ul class="nav-links" id="navMenu">
          <li><a href="index.html">홈</a></li>
          <li><a href="date.html">갤러리</a></li>
          <li><a href="date.html">데이트 장소</a></li>
          <li><a href="hhhh.html">공주님 소개</a></li>
        </ul>
      </nav>
    </header>

    <h1>❤️Photography❤️</h1>

    <div class="gallery-container">
      <img src="img/11111.png" alt="사진1" onclick="openZoom(this)" />
      <img src="img/22222.png" alt="사진2" onclick="openZoom(this)" />
      <img src="img/33333.png" alt="사진3" onclick="openZoom(this)" />
      <img src="img/44444.png" alt="사진4" onclick="openZoom(this)" />
      <img src="img/55555.png" alt="사진5" onclick="openZoom(this)" />
      <img src="img/66666.png" alt="사진6" onclick="openZoom(this)" />
      <img src="img/77777.png" alt="사진7" onclick="openZoom(this)" />
      <img src="img/88888.png" alt="사진8" onclick="openZoom(this)" />
      <img src="img/99999.jpeg" alt="사진9" onclick="openZoom(this)" />
    </div>

    <div style="text-align: center; margin: 60px 0 80px">
      <a href="index.html" class="btn-back">돌아가기</a>
    </div>

    <div id="zoom-modal" class="zoom-overlay" onclick="closeZoom()">
      <span class="close-zoom">&times;</span>
      <img id="zoom-target" class="zoom-img" src="" />
    </div>

    <script>
      // [추가됨] 드롭다운 메뉴 열고 닫기 함수
      function toggleMenu() {
        const menu = document.getElementById("navMenu");
        menu.classList.toggle("active");
      }

      // 사진 클릭 시 실행되는 함수
      function openZoom(element) {
        const modal = document.getElementById("zoom-modal");
        const zoomImg = document.getElementById("zoom-target");
        zoomImg.src = element.src;
        modal.style.display = "flex";
      }

      // 닫기 함수
      function closeZoom() {
        document.getElementById("zoom-modal").style.display = "none";
      }

      // 메뉴 바깥 화면을 클릭하면 드롭다운 메뉴가 닫히도록 설정
      window.onclick = function (event) {
        if (!event.target.matches(".menu-btn")) {
          const menus = document.getElementsByClassName("nav-links");
          for (let i = 0; i < menus.length; i++) {
            let openDropdown = menus[i];
            if (openDropdown.classList.contains("active")) {
              openDropdown.classList.remove("active");
            }
          }
        }
      };
    </script>
  </body>
</html>
