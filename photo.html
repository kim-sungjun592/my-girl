<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인생네컷</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <nav class="container">
            <h2 class="logo">
                <a href="index.html" style="text-decoration:none; color:inherit;">우리<span>활동</span></a>
            </h2>
            <ul class="nav-links">
                <li><a href="index.html">홈</a></li>
                <li><a href="date.html">갤러리</a></li>
                <li><a href="date.html">데이트 장소</a></li>
                <li><a href="hhhh.html">공주님 소개</a></li>
            </ul>
        </nav>
    </header>

    <style>
        /* [1] 기본 스타일 초기화 */
        body {
            margin: 0;
            padding: 0;
            text-align: center;
            background-color: #f9f9f9;
            font-family: 'Noto Sans KR', sans-serif;
        }

        /* [2] 헤더 스타일 - ★ 글자 크기 유지 & 줄바꿈 방지 ★ */
        header {
            background: #fff;
            height: 70px;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav.container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            box-sizing: border-box;
            overflow-x: auto;
            /* 폰 화면이 좁을 때 가로 스크롤 허용 (디자인 안 깨짐) */
        }

        /* 스크롤바는 깔끔하게 숨기기 */
        nav.container::-webkit-scrollbar {
            display: none;
        }

        nav.container {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .logo {
            margin: 0;
            margin-right: 20px;
        }

        .logo a {
            text-decoration: none;
            color: #2563eb;
            font-size: 1.5rem;
            font-weight: bold;
            white-space: nowrap;
            /* 로고 글자 줄바꿈 방지 */
        }

        .logo span {
            color: #333;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 20px;
            margin: 0;
            padding: 0;
            align-items: center;
        }

        .nav-links li {
            white-space: nowrap;
            /* ★ '데이트 장소' 띄어쓰기 있어도 두 줄로 안 꺾이게 고정 */
        }

        .nav-links a {
            text-decoration: none;
            color: #555;
            font-weight: bold;
            transition: color 0.3s;
            /* 글자 크기 건드리지 않음 (기본값 유지) */
        }

        .nav-links a:hover {
            color: #2563eb;
        }

        /* [3] 갤러리 스타일 */
        .gallery-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery-container img {
            width: 120px;
            height: auto;
            object-fit: contain;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .gallery-container img:hover {
            transform: scale(1.05);
            filter: brightness(0.9);
        }

        /* 제목 스타일 */
        h1 {
            background-color: #0cf33e;
            padding: 20px;
            margin-top: 0;
            color: #fff;
            margin-bottom: 30px;
        }

        /* 버튼 스타일 */
        .btn-back {
            display: inline-block;
            background-color: #f67bd7;
            color: white;
            padding: 10px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.3s;
        }

        .btn-back:hover {
            background-color: #7c3aed;
        }

        /* [4] 확대 모달창 스타일 */
        .zoom-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s;
        }

        .zoom-img {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            object-fit: contain;
        }

        .close-zoom {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 3rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .close-zoom:hover {
            color: #ff4757;
            transform: rotate(90deg);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
    </style>

    <style>
        /* --- 추가된 배경 꾸미기 스타일 시작 --- */
        body {
            background-image: linear-gradient(to bottom, #fffaf0, #eef6fc);
            background-color: transparent;
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60" opacity="0.05"><path d="M30 10 C35 10 40 15 40 20 C40 25 35 30 30 30 C25 30 20 25 20 20 C20 15 25 10 30 10 Z M10 40 C10 35 15 30 20 30 L40 30 C45 30 50 35 50 40 L50 50 C50 55 45 60 40 60 L20 60 C15 60 10 55 10 50 Z M25 40 C25 43 27 45 30 45 C33 45 35 43 35 40 C35 37 33 35 30 35 C27 35 25 37 25 40 Z" fill="%23555"/></svg>');
            background-size: 60px 60px;
            z-index: -1;
            pointer-events: none;
        }

        h1 {
            background-color: rgba(12, 243, 62, 0.85) !important;
            box-shadow: 0 8px 20px rgba(12, 243, 62, 0.3), 0 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 0 0 20px 20px;
            position: relative;
            z-index: 1;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .gallery-container {
            background-color: #ffffff;
            padding: 40px !important;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1), 0 5px 15px rgba(0, 0, 0, 0.05);
            margin-top: 40px !important;
            border: 1px solid rgba(0, 0, 0, 0.05);
            position: relative;
        }

        .gallery-container::before {
            content: "";
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 30px;
            background-color: rgba(255, 235, 59, 0.5);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            z-index: 2;
        }

        .gallery-container img {
            background-color: white;
            padding: 10px 10px 25px 10px;
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.15) !important;
            transform: rotate(calc(var(--r, 0deg) * 1deg));
        }

        .gallery-container img:hover {
            transform: scale(1.1) rotate(0deg) !important;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3) !important;
            z-index: 10;
        }

        .gallery-container img:nth-child(odd) {
            --r: -3;
        }

        .gallery-container img:nth-child(even) {
            --r: 2;
        }

        .gallery-container img:nth-child(3n) {
            --r: 1;
        }

        /* --- 📸 포토그래픽 감성 제목(h1) 꾸미기 시작 --- */
        h1 {
            background: linear-gradient(135deg, #2c3e50, #1a252f) !important;
            color: #fffaf0 !important;
            width: fit-content !important;
            margin: 30px auto 40px auto !important;
            padding: 20px 50px !important;
            border-radius: 10px !important;
            border: 2px dashed rgba(255, 255, 255, 0.4) !important;
            outline: 8px solid #2c3e50;
            transform: rotate(-2deg);
            font-size: 2.2rem;
            letter-spacing: 3px;
            font-weight: 900;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3), 0 0 20px rgba(255, 105, 180, 0.5) !important;
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.15), inset 0 0 20px rgba(0, 0, 0, 0.5) !important;
            position: relative;
        }

        h1::before,
        h1::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 14px;
            height: 14px;
            background: radial-gradient(circle, #e0e0e0 0%, #95a5a6 100%);
            border-radius: 50%;
            transform: translateY(-50%);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6), 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        h1::before {
            left: 15px;
        }

        h1::after {
            right: 15px;
        }

        h1:hover {
            transform: rotate(0deg) scale(1.02);
            transition: all 0.3s ease;
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.2) !important;
        }

        /* 모바일에서 h1 제목 크기만 살짝 조절 (헤더 메뉴는 건드리지 않음) */
        @media (max-width: 600px) {
            h1 {
                font-size: 1.5rem;
                padding: 15px 30px !important;
            }
        }
    </style>

    <h1 style="text-align: center; margin-top: 20px;">❤️Photography❤️</h1>

    <div class="gallery-container">
        <img src="img/11111.png" alt="사진1" onclick="openZoom(this)">
        <img src="img/22222.png" alt="사진2" onclick="openZoom(this)">
        <img src="img/33333.png" alt="사진3" onclick="openZoom(this)">
        <img src="img/44444.png" alt="사진4" onclick="openZoom(this)">
        <img src="img/55555.png" alt="사진5" onclick="openZoom(this)">
        <img src="img/66666.png" alt="사진6" onclick="openZoom(this)">
        <img src="img/77777.png" alt="사진7" onclick="openZoom(this)">
        <img src="img/88888.png" alt="사진8" onclick="openZoom(this)">
    </div>

    <div style="text-align: center; margin: 60px 0;">
        <a href="index.html" class="btn-back">돌아가기</a>
    </div>

    <div id="zoom-modal" class="zoom-overlay" onclick="closeZoom()">
        <span class="close-zoom">&times;</span>
        <img id="zoom-target" class="zoom-img" src="">
    </div>

    <script>
        // 사진 클릭 시 실행되는 함수
        function openZoom(element) {
            const modal = document.getElementById('zoom-modal');
            const zoomImg = document.getElementById('zoom-target');

            // 클릭한 사진의 주소를 가져와서 모달창 이미지에 넣음
            zoomImg.src = element.src;

            // 모달창 보여주기
            modal.style.display = 'flex';
        }

        // 닫기 함수
        function closeZoom() {
            document.getElementById('zoom-modal').style.display = 'none';
        }
    </script>

</body>

</html>
